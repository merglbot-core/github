name: Policy Validation

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/policies/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/policies/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: policy-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-policies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The verdict uses the policy from the PR base, so a PR cannot weaken the
      # policy it is judged by (github-security-auditor#225). The check stays
      # non-required; the PR's own policy is evaluated for information only.
      - name: Checkout base policy
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-policy
          sparse-checkout: .github/policies
          persist-credentials: false
      
      - name: Install Conftest
        run: |
          set -euo pipefail
          CONFTEST_VERSION="0.49.1"
          wget "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar xzf "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          sudo mv conftest /usr/local/bin/
          conftest --version
      
      - name: Verify policy unit tests
        run: conftest verify --policy .github/policies --no-color

      - name: Validate all workflows
        id: validate
        run: |
          set -euo pipefail
          
          POLICY_DIR=.github/policies
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -d base-policy/.github/policies ]; then
            POLICY_DIR=base-policy/.github/policies
            echo "Verdict policy: PR base commit"
          fi
          
          echo "🔍 Validating workflows against policies..."
          echo ""
          
          FAILED=0
          PASSED=0
          WARNINGS=0
          
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$workflow" ] || continue
            
            echo "Checking: $workflow"
            
            if conftest test "$workflow" \
              --policy "$POLICY_DIR" \
              --output table \
              --no-color 2>&1 | tee /tmp/conftest-output.txt; then
              echo "  ✅ PASS"
              PASSED=$((PASSED + 1))
            else
              echo "  ❌ FAIL"
              FAILED=$((FAILED + 1))
              cat /tmp/conftest-output.txt >> $GITHUB_STEP_SUMMARY
            fi
            
            # Check for warnings
            if grep -q "WARN" /tmp/conftest-output.txt 2>/dev/null; then
              WARNINGS=$((WARNINGS + 1))
            fi
            
            echo ""
          done
          
          echo "validation_failed=$FAILED" >> $GITHUB_OUTPUT
          echo "validation_passed=$PASSED" >> $GITHUB_OUTPUT
          echo "validation_warnings=$WARNINGS" >> $GITHUB_OUTPUT
          
          # Summary
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 📋 Policy Validation Results
          
          - ✅ **Passed**: $PASSED workflows
          - ❌ **Failed**: $FAILED workflows
          - ⚠️  **Warnings**: $WARNINGS workflows
          
          ### Policy Checks
          - SHA pinning for actions
          - Concurrency control
          - Timeout minutes
          - No hardcoded secrets
          - Explicit permissions
          - SOC2 compliance (production reviewers, data leakage)
          - Container scanning (Trivy)
          
          EOF
          
          # Information only: the PR's own policy, when it differs from the base.
          if [ "$POLICY_DIR" != ".github/policies" ] && ! diff -rq "$POLICY_DIR" .github/policies > /dev/null; then
            echo "### PR policy (information only, not the verdict)" >> "$GITHUB_STEP_SUMMARY"
            for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
              [ -f "$workflow" ] || continue
              if ! conftest test "$workflow" --policy .github/policies --output table --no-color > /tmp/conftest-pr.txt 2>&1 \
                 || grep -q "WARN" /tmp/conftest-pr.txt; then
                { echo "- $workflow"; echo '```'; cat /tmp/conftest-pr.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              fi
            done
          fi
          
          if [ $FAILED -gt 0 ]; then
            echo "❌ Policy validation failed for $FAILED workflow(s)"
            exit 1
          fi
          
          echo "✅ All workflows passed policy validation"
      
      - name: Comment on PR (if failures)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const output = `## ❌ Policy Validation Failed
            
            **Failed workflows**: ${{ steps.validate.outputs.validation_failed }}
            **Passed workflows**: ${{ steps.validate.outputs.validation_passed }}
            **Warnings**: ${{ steps.validate.outputs.validation_warnings }}
            
            Please review the workflow summary for details on policy violations.
            
            ### Common Fixes
            - Use SHA-pinned actions (not tags): \`uses: actions/checkout@abc123...\`
            - Add \`concurrency:\` block to workflows with push triggers
            - Add \`timeout-minutes:\` to all jobs
            - Use \`$\{\{secrets.*\}\}\` for secrets (never hardcode)
            - Add explicit \`permissions:\` blocks
            
            See: \`.github/policies/workflows.rego\` for all policy rules.
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

