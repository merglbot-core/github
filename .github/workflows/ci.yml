name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Python for cost-monitoring tests
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: platform/tools/cost-monitoring/pyproject.toml
      - name: Validate PR Assistant helper scripts
        run: |
          set -euo pipefail
          bash -n scripts/pr-assistant/pr-assistant-step1-parallel-api-calls.sh
          bash -n scripts/pr-assistant/secret-scan-patterns-smoke-test.sh
          bash scripts/pr-assistant/secret-scan-patterns-smoke-test.sh
          python3 -m py_compile scripts/pr-assistant/verify-review-receipt.py
          python3 -m py_compile scripts/pr-assistant/pr-assistant-v4-evidence-canary.py
          python3 -m py_compile scripts/pr-assistant/final-merge-readiness.py
          python3 scripts/pr-assistant/verify-review-receipt.py --self-test
          python3 scripts/pr-assistant/pr-assistant-v4-evidence-canary.py self-test
          python3 scripts/pr-assistant/pr-assistant-v4-evidence-canary.py validate-config
          python3 scripts/pr-assistant/final-merge-readiness.py --self-test
          python3 -m py_compile scripts/dependabot/ent_dependabot_closeout.py
          python3 scripts/dependabot/ent_dependabot_closeout.py --self-test
      - name: Run repo contract tests (unittest discover collects TestCase only)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run cost-monitoring tests
        run: |
          set -euo pipefail
          python3 -m pip install -e 'platform/tools/cost-monitoring[dev]'
          python3 -m pytest -q platform/tools/cost-monitoring/tests
      - name: Validate PR Assistant rollout manifest
        run: |
          set -euo pipefail
          python3 scripts/pr-assistant/repo-policy-manifest.py verify-manifest
