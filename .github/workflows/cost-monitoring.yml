name: Cost Monitoring

on:
  schedule:
    - cron: "0 8 * * *"  # Daily at 08:00 UTC
  workflow_dispatch:
    inputs:
      month:
        description: "Month to analyze (YYYY-MM)"
        required: false
        type: string
      dry_run:
        description: "Skip notifications (dry run)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # For WIF/OIDC
  issues: write    # For creating issues
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    name: Generate Cost Report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: platform/tools/cost-monitoring/pyproject.toml

      - name: Authenticate to GCP via WIF
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          export_environment_variables: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd platform/tools/cost-monitoring
          pip install -e .

      - name: Copy config templates if needed
        run: |
          cd platform/tools/cost-monitoring
          if [ ! -f config/settings.yml ]; then
            cp config/settings.example.yml config/settings.yml
          fi
          if [ ! -f config/thresholds.yml ]; then
            cp config/thresholds.example.yml config/thresholds.yml
          fi

      - name: Generate cost report
        id: generate
        working-directory: platform/tools/cost-monitoring
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Read-only enterprise/org billing APIs require the separately scoped token.
          ENTERPRISE_GITHUB_TOKEN: ${{ secrets.ENTERPRISE_GITHUB_TOKEN }}
          # Keep the run token isolated to optional issue creation.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONITOR_MONTH: ${{ inputs.month }}
          MONITOR_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          CMD=(python -m cost_monitoring.cli generate --outdir reports --soft-fail)

          if [ -n "$MONITOR_MONTH" ]; then
            CMD+=(--month "$MONITOR_MONTH")
          fi

          if [ "$MONITOR_DRY_RUN" = "true" ]; then
            CMD+=(--dry-run)
          fi

          echo "reports_dir=$(pwd)/reports" >> "$GITHUB_OUTPUT"
          "${CMD[@]}"

      - name: AI Usage Telemetry Alerts (Budgets)
        id: ai_usage_alerts
        # This is a separate notifier path from the main CLI. A workflow-dispatch
        # dry run must suppress both paths; scheduled runs and normal dispatches
        # still execute the budget alerts.
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        working-directory: platform/tools/cost-monitoring
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Defaults are safe; keep explicit for clarity.
          AI_USAGE_ADMIN_PROJECT_ID: "merglbot-admin-prd"
          AI_USAGE_SETTINGS_FIRESTORE_DATABASE_ID: "ai-usage-settings"
          AI_USAGE_PLATFORM_PROJECT_ID: "merglbot-platform-prd"
          AI_USAGE_DATASET: "ai_usage"
        run: |
          set -euo pipefail
          EXIT=0
          python -m cost_monitoring.ai_usage_alerts || EXIT=$?

          echo "exit_code=${EXIT}" >> "$GITHUB_OUTPUT"

          # `2` means "alerts found" (expected behavior); fail only on unexpected error codes.
          if [ "$EXIT" -ne 0 ] && [ "$EXIT" -ne 2 ]; then
            exit "$EXIT"
          fi

      - name: Generate Step Summary
        if: always()
        working-directory: platform/tools/cost-monitoring
        run: |
          {
            echo "## 💰 Cost Monitoring Report"
            echo ""

            MD_FILE=$(find reports -name "*.md" -type f | head -1)
            if [ -f "$MD_FILE" ]; then
              head -n 200 "$MD_FILE"

              if [ "$(wc -l < "$MD_FILE")" -gt 200 ]; then
                echo ""
                echo "*... Report truncated. See artifacts for full report.*"
              fi
            else
              echo "❌ No report generated"
            fi

            echo ""
            echo "---"
            echo "- Generate outcome: ${{ steps.generate.outcome }}"
            echo "- AI usage alerts exit code: ${{ steps.ai_usage_alerts.outputs.exit_code }}"
            echo "- Reports directory: ${{ steps.generate.outputs.reports_dir }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cost reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: cost-reports-${{ github.run_id }}
          path: platform/tools/cost-monitoring/reports/
          retention-days: 90
