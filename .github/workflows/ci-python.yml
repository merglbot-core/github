# CI: Python
# Reusable workflow for Python projects (CI: lint, test)
#
# Usage:
#   jobs:
#     ci:
#       uses: merglbot-core/github/.github/workflows/ci-python.yml@<sha>  # vX.Y.Z
#       with:
#         python-version: '3.11'
#
# Purpose: Standardize Python CI (denatura-btf-data, future projects)
# Category: CI
# Priority: MEDIUM
# Status: PRODUCTION
# Created: 2025-11-12 (Enterprise CI Audit)

name: CI - Python

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        type: string
        default: '3.11'
        required: false
      
      requirements-file:
        description: 'Requirements file path'
        type: string
        default: 'requirements.txt'
        required: false
      
      test-command:
        description: 'Test command (default: pytest)'
        type: string
        default: 'pytest'
        required: false
      
      lint-tools:
        description: 'Comma-separated list of linters (ruff,black,mypy)'
        type: string
        default: 'ruff,black'
        required: false
      
      working-directory:
        description: 'Working directory for commands'
        type: string
        default: '.'
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    name: Python CI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.requirements-file }}
      
      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ inputs.requirements-file }}
      
      - name: Install dev dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi
          # Install linters based on inputs — repo-first with a PINNED hub default.
          # A bare `pip install ruff` resolves to whatever is latest at run time, so an
          # upstream release flips CI estate-wide with zero repo changes (github#728:
          # ruff 0.16.0 landed on a weekend and reddened mains that had no ruff pin of
          # their own). If the repo ships the tool via requirements-dev.txt, that pin
          # wins (command -v check); otherwise the hub installs an exact version.
          # Bumping these pins = a deliberate hub PR, reviewed like any other change.
          if [[ "${{ inputs.lint-tools }}" == *"ruff"* ]]; then
            command -v ruff >/dev/null 2>&1 || pip install "ruff==0.16.0"
          fi
          if [[ "${{ inputs.lint-tools }}" == *"black"* ]]; then
            command -v black >/dev/null 2>&1 || pip install "black==26.5.1"
          fi
          if [[ "${{ inputs.lint-tools }}" == *"mypy"* ]]; then
            command -v mypy >/dev/null 2>&1 || pip install "mypy==2.3.0"
          fi
      
      - name: Run ruff
        if: contains(inputs.lint-tools, 'ruff')
        working-directory: ${{ inputs.working-directory }}
        run: ruff check .
      
      - name: Run black
        if: contains(inputs.lint-tools, 'black')
        working-directory: ${{ inputs.working-directory }}
        run: black --check .
      
      - name: Run mypy
        if: contains(inputs.lint-tools, 'mypy')
        working-directory: ${{ inputs.working-directory }}
        run: mypy .
      
      - name: Run tests
        if: inputs.test-command != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}
        env:
          PYTHONPATH: ${{ inputs.working-directory }}
