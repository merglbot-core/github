name: Markdown danger lint

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Fail on dangerous --force --all pattern
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # List changed Markdown files. A failed diff (shallow history) is retried
          # once after fetching the base commit; if it still fails the lint warns
          # instead of passing silently (github-security-auditor#318).
          list_changed_markdown() {
            local out="$1"
            if git diff --name-only "${BASE_SHA}...HEAD" -- '*.md' > "$out" 2>/dev/null; then
              return 0
            fi
            git fetch --no-tags --quiet origin "${BASE_SHA}" 2>/dev/null || true
            if git diff --name-only "${BASE_SHA}" HEAD -- '*.md' > "$out" 2>/dev/null; then
              return 0
            fi
            : > "$out"
            echo "::warning title=Markdown danger lint incomplete::Could not diff against ${BASE_SHA}; changed Markdown files were not scanned."
            return 0
          }
          # A line is suppressed only when the warning word precedes the command.
          # A warning word that only follows the command is reported as a warning
          # (not a failure) so existing agent PRs are not stopped; a line without
          # any warning word fails as before (github-security-auditor#318).
          DANGER='git[[:space:]]+push.*(--all.*--force|--force.*--all|--all.*-f\b|-f\b.*--all)'
          CAUTION='never|do not|nepoužívej|nepouzivej|nepoužij'
          scan_markdown() {
            local list="$1" f hit text fail=0
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              [ -f "$f" ] || continue
              while IFS= read -r hit; do
                text="${hit#*:}"
                if grep -qiE "(${CAUTION}).*git[[:space:]]+push" <<< "$text"; then
                  continue
                elif grep -qiE "${CAUTION}" <<< "$text"; then
                  echo "::warning file=${f},line=${hit%%:*}::git push --force --all with the warning only after the command; put the warning first."
                else
                  echo "Dangerous pattern in ${f}:${hit%%:*} (git push with --force + --all)."
                  fail=1
                fi
              done < <(grep -nEi -- "${DANGER}" "$f" || true)
            done < "$list"
            return "$fail"
          }
          list_changed_markdown changed_md.txt
          echo "Changed MD files:"; cat changed_md.txt
          if ! scan_markdown changed_md.txt; then
            echo "::error title=Unsafe git command detected::Found 'git push --force --all' in changed Markdown files."
            exit 1
          fi
          echo "✅ No dangerous patterns found."
