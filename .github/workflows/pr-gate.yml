# =============================================================================
# Reusable - PR Gate
#
# ONE job that runs the three cheap per-PR gates that used to be three separate
# jobs: dependency review, PR hygiene checks and docs governance. The steps are
# copied VERBATIM from security-dependency-review.yml, utility-pr-checks.yml and
# reusable-docs-governance.yml — no rule, threshold, pin or message changed.
#
# WHY: GitHub bills ceil(seconds/60) PER JOB. Measured 2026-09-21 across five
# repositories, the three jobs take 7-12 s each and are billed as 3 minutes;
# as steps of one job they are ~30 s = 1 minute. On merglbot-core/infra alone
# that is ~10 000 billed minutes a month (github#877).
#
# Gitleaks deliberately stays a separate workflow/job: it takes 53-58 s on its
# own, so folding it in would cost a second billed minute anyway, and it needs
# `security-events: write` which nothing else here should inherit.
#
# DIFFERENCES from the three originals, both deliberate:
#   1. `pull-requests: write` (dependency-review needs it to post its summary
#      comment; the pr-checks and docs-governance steps previously ran with
#      `read`). No step here executes pull-request-controlled code: every action
#      is SHA-pinned and check.mjs comes from the pinned hub checkout.
#   2. ONE checkout with `fetch-depth: 0` (docs-governance needs full history)
#      AND `persist-credentials: false` (dependency-review's hygiene choice).
#      check.mjs's `git fetch` fallbacks are try/catch and fail open to
#      DOCS_GOVERNANCE_STATE: unknown, which `mode: advisory` never fails on,
#      so the stricter checkout cannot turn a green check red.
#   3. Every functional step carries `if: ${{ !cancelled() }}` and a final gate
#      step reports which part failed. Three separate jobs used to surface all
#      three results on one run; without this, the first failure would hide the
#      rest. Cancellation (superseded run) still skips cleanly, so a cancelled
#      run does not post a spurious red.
#
# Check name for branch protection: **`PR Gate`** (context `pr-gate / PR Gate`
# when the caller names its job `pr-gate`).
# =============================================================================

name: Reusable - PR Gate

on:
  workflow_call:
    inputs:
      # --- dependency review (security-dependency-review.yml) ---
      fail-on-severity:
        description: 'Minimum severity to fail the workflow (critical, high, moderate, low)'
        type: string
        default: 'moderate'
        required: false
      deny-licenses:
        description: 'Comma-separated list of licenses to deny (e.g., GPL-3.0,AGPL-3.0)'
        type: string
        default: ''
        required: false
      comment-summary-in-pr:
        description: 'Post a comment with the summary in the PR'
        type: boolean
        default: true
        required: false
      # --- PR hygiene (utility-pr-checks.yml) ---
      max-pr-size:
        description: 'Maximum PR size in LOC (GitHub additions+deletions; 0 to disable). See MERGLBOT_PR_SIZE_AND_REVIEW_HYGIENE.md (MERGLBOT-PR-001).'
        type: number
        default: 2000
        required: false
      enforce-conventional-commits:
        description: 'Enforce conventional commit format in PR title'
        type: boolean
        default: true
        required: false
      allowed-branch-prefixes:
        description: 'Comma-separated allowed branch prefixes (feat/,fix/,docs/,ci/)'
        type: string
        default: 'feat/,fix/,docs/,ci/,chore/,refactor/'
        required: false
      pull-request-number:
        description: 'Pull request number (required when invoked via workflow_call)'
        type: number
        required: true
      # --- docs governance (reusable-docs-governance.yml) ---
      mode:
        description: advisory | enforce
        type: string
        required: false
        default: advisory
      impact-prefixes:
        description: comma-separated override of impactful path prefixes
        type: string
        required: false
        default: ""
      # --- optional secret scan (security-gitleaks.yml as a step, github#895) ---
      # Folding gitleaks into this job removes one billed job-minute per PR sync
      # (GitHub bills ceil(seconds/60) per JOB). Measured 2026-09-22 on
      # merglbot-extractors/shoptet-extractor: the standalone job took 54 s, of
      # which 45 s was `Upload SARIF report`; the scan itself is ~1 s. This step
      # therefore keeps the scan and the redacted summary but NOT the SARIF
      # upload, so PR Gate stays well inside one billed minute (~20 s total).
      # Push protection (GHAS Secret Protection) is unaffected and still runs.
      gitleaks:
        description: 'Run a gitleaks secret scan as a step of this job (no SARIF upload)'
        type: boolean
        default: false
        required: false
      gitleaks-config-path:
        description: 'Repo-relative path to a custom gitleaks config (optional)'
        type: string
        default: ''
        required: false
      gitleaks-upload-report:
        description: 'Upload the redacted gitleaks JSON report as a build artifact'
        type: boolean
        default: false
        required: false
      # --- optional markdown danger lint (github#891) ---
      markdown-danger-lint:
        description: 'Fail when changed Markdown documents a `git push --force --all`'
        type: boolean
        default: false
        required: false
      # --- optional PR text length (length-check.yml as a step, github#891) ---
      pr-text-length:
        description: 'Enforce PR title/body length limits (dependabot is waived)'
        type: boolean
        default: false
        required: false
      pr-text-max-title:
        description: 'Maximum PR title length in characters'
        type: number
        default: 100
        required: false
      pr-text-max-body:
        description: 'Maximum PR body length in bytes'
        type: number
        default: 4000
        required: false
      # --- runner (merglbot-core/github#913) ---
      runs-on:
        description: >-
          Runner label for the PR Gate job: `ubuntu-24.04` (default, unchanged) or
          `ubuntu-slim`; any other value is ignored and runs on ubuntu-24.04. A caller
          opts in to `ubuntu-slim` (1 vCPU, 0.002 USD/min vs 0.006) with
          `runs-on: ubuntu-slim`; the pilot callers' runs are the execution evidence
          before the default flips in a separate change (merglbot-core/github#913).
        type: string
        default: 'ubuntu-24.04'
        required: false

permissions:
  contents: read

jobs:
  pr-gate:
    name: PR Gate
    # ubuntu-slim (merglbot-core/github#913, EPIC #910): every step here is API calls,
    # a git checkout and small node/shell scripts; gitleaks installs into RUNNER_TEMP
    # without sudo and nothing uses Docker, which the unprivileged slim container
    # lacks. Measured 2026-09-23: 13-18 s on 2 vCPU (admin, BA, shoptet), so even 2x slower
    # it stays in one billed minute at a third of the price. The check name
    # `PR Gate` is unchanged, so no branch protection edits are needed.
    # This change keeps ubuntu-24.04 as the default: callers opt in per repository,
    # and the default flips only after the pilot callers have green slim runs.
    # Allowlist, not pass-through: a caller can only choose between the two hosted labels;
    # any other value (self-hosted, a larger runner) falls back to ubuntu-24.04.
    runs-on: ${{ inputs.runs-on == 'ubuntu-slim' && 'ubuntu-slim' || 'ubuntu-24.04' }}
    # The 1-vCPU runner terminates jobs at 15 min; 2 vCPU keeps the old 30 min budget
    # (sum of the three originals' budgets 15 + 10 + 5).
    timeout-minutes: ${{ inputs.runs-on == 'ubuntu-slim' && 15 || 30 }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: PR runs check out a SHALLOW synthetic merge commit, so
          # base...HEAD merge-base is unsatisfiable at depth 1 — check.mjs only
          # deepens the BASE side and silently degrades to
          # DOCS_GOVERNANCE_STATE: unknown (fail-open) on every consumer (#724).
          fetch-depth: 0
          persist-credentials: false

      - name: Run Dependency Review
        id: dependency_review
        if: ${{ !cancelled() }}
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4.9.0
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
          deny-licenses: ${{ inputs.deny-licenses }}
          comment-summary-in-pr: ${{ inputs.comment-summary-in-pr }}
          
          # Additional security configurations
          vulnerability-check: true
          license-check: true
          
          # Do not block required PR checks waiting for dependency snapshots
          # that these repos do not produce; the default is fail-fast.
          retry-on-snapshot-warnings: false

      - name: Fetch PR metadata
        id: pr-data
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            const prNumber = Number(process.env.PR_NUMBER_INPUT || '0');
            if (!Number.isFinite(prNumber) || prNumber <= 0) {
              core.setFailed('pull-request-number input must be provided for reusable workflow calls.');
              return;
            }
            
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            core.setOutput('title', pr.title ?? '');
            core.setOutput('branch', pr.head.ref ?? '');
            core.setOutput('additions', String(pr.additions ?? 0));
            core.setOutput('deletions', String(pr.deletions ?? 0));
            core.setOutput('number', String(pr.number));
        env:
          PR_NUMBER_INPUT: ${{ inputs.pull-request-number }}

      - name: Check PR title (Conventional Commits)
        id: pr_title
        if: ${{ !cancelled() && inputs.enforce-conventional-commits }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const title = process.env.PR_TITLE || '';
            const pattern = /^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?!?: .+/;
            
            if (!pattern.test(title)) {
              core.setFailed(
                `PR title "${title}" doesn't follow Conventional Commits format.\n` +
                `Expected: type(scope)?: description\n` +
                `Examples: feat: add login, fix(api): resolve timeout, docs: update README`
              );
            } else {
              console.log(`✅ PR title follows Conventional Commits format`);
            }
        env:
          PR_TITLE: ${{ steps.pr-data.outputs.title }}
      
      - name: Check branch naming
        id: pr_branch
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const branch = process.env.PR_BRANCH || '';
            const allowedPrefixes = '${{ inputs.allowed-branch-prefixes }}'.split(',');
            
            const isValid = allowedPrefixes.some(prefix => branch.startsWith(prefix.trim()));
            
            if (!isValid) {
              core.warning(
                `Branch "${branch}" doesn't follow naming convention.\n` +
                `Recommended prefixes: ${allowedPrefixes.join(', ')}`
              );
            } else {
              console.log(`✅ Branch name follows convention`);
            }
        env:
          PR_BRANCH: ${{ steps.pr-data.outputs.branch }}
      
      - name: Check PR size
        id: pr_size
        if: ${{ !cancelled() && inputs.max-pr-size > 0 }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const additions = Number(process.env.PR_ADDITIONS || '0');
            const deletions = Number(process.env.PR_DELETIONS || '0');
            const totalChanges = additions + deletions;
            const maxSize = ${{ inputs.max-pr-size }};
            
            console.log(`📊 PR size: +${additions} -${deletions} (total: ${totalChanges} LOC)`);
            
            if (totalChanges > maxSize) {
              core.warning(
                `⚠️ Large PR detected: ${totalChanges} LOC (limit: ${maxSize}).\n` +
                `Consider splitting into smaller PRs for easier review.`
              );
            } else {
              console.log(`✅ PR size OK (${totalChanges}/${maxSize} LOC)`);
            }
        env:
          PR_ADDITIONS: ${{ steps.pr-data.outputs.additions }}
          PR_DELETIONS: ${{ steps.pr-data.outputs.deletions }}
      
      - name: Check for merge commits
        id: pr_merge_commits
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER || '0');
            if (!Number.isFinite(prNumber) || prNumber <= 0) {
              core.setFailed('PR metadata missing; ensure pull-request-number input is provided.');
              return;
            }

            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            const mergeCommits = commits.filter(commit => commit.parents.length > 1);
            
            if (mergeCommits.length > 0) {
              core.warning(
                `⚠️ Found ${mergeCommits.length} merge commit(s) in PR.\n` +
                `Use rebase or squash merge to maintain linear history.`
              );
            } else {
              console.log(`✅ No merge commits found`);
            }
        env:
          PR_NUMBER: ${{ steps.pr-data.outputs.number }}
      # Pin the governance CODE + config to the SAME hub commit the caller pinned
      # this reusable workflow to (job.workflow_sha / job.workflow_repository reflect
      # the CALLED workflow file — unlike github.workflow_sha, which is the caller's).
      # Without this, a consumer pinned to hub@SHA_X still executed check.mjs and
      # ssot-map.snapshot.json from mutable hub main (transitive supply-chain gap).
      - name: Resolve pinned hub governance ref
        if: ${{ !cancelled() }}
        id: hubref
        env:
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
          JOB_WORKFLOW_REPO: ${{ job.workflow_repository }}
        run: |
          # Fall back to the hub repo + this workflow's SHA if job.workflow_* is
          # unavailable on this runner version, so the checkout always pins a commit.
          repo="${JOB_WORKFLOW_REPO:-merglbot-core/github}"
          ref="${JOB_WORKFLOW_SHA:-${GITHUB_SHA}}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "docs-governance code pinned to $repo@$ref"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !cancelled() }}
        with:
          repository: ${{ steps.hubref.outputs.repo }}
          ref: ${{ steps.hubref.outputs.ref }}
          path: .docs-governance-hub
          sparse-checkout: |
            actions/docs-governance
            config/ssot-map.snapshot.json
      - name: docs-governance
        id: docs_governance
        if: ${{ !cancelled() }}
        env:
          DG_MODE: ${{ inputs.mode }}
          DG_IMPACT_PREFIXES: ${{ inputs['impact-prefixes'] }}
          DG_EVENT_PATH: ${{ github.event_path }}
          DG_REPO: ${{ github.repository }}
          DG_ACTION_PATH: ${{ github.workspace }}/.docs-governance-hub/actions/docs-governance
        run: node "$DG_ACTION_PATH/check.mjs"

      # --- optional gitleaks secret scan (github#895) -------------------------
      # Installed into RUNNER_TEMP (no sudo) and pinned by release checksum, so a
      # compromised release asset cannot silently replace the scanner.
      - name: Install gitleaks
        if: ${{ !cancelled() && inputs.gitleaks }}
        env:
          GITLEAKS_VERSION: '8.18.4'
          GITLEAKS_SHA256: 'ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d'
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "$dest"
          curl -fsSL -o "${RUNNER_TEMP}/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tgz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tgz" -C "$dest" gitleaks
          chmod +x "$dest/gitleaks"
          echo "$dest" >> "$GITHUB_PATH"
          "$dest/gitleaks" version

      - name: Run gitleaks
        id: gitleaks
        if: ${{ !cancelled() && inputs.gitleaks }}
        shell: bash
        env:
          GITLEAKS_CONFIG_PATH: ${{ inputs['gitleaks-config-path'] }}
          REPORT_PATH: ${{ runner.temp }}/gitleaks-report.json
        run: |
          set -uo pipefail
          # Reject absolute paths and traversal in the caller-supplied config path.
          config_args=()
          if [ -n "${GITLEAKS_CONFIG_PATH}" ]; then
            case "${GITLEAKS_CONFIG_PATH}" in
              /*|*..*) echo "::error::gitleaks-config-path must be a repo-relative path without '..'"; exit 1 ;;
            esac
            if [ ! -f "${GITLEAKS_CONFIG_PATH}" ]; then
              echo "::error::gitleaks config not found: ${GITLEAKS_CONFIG_PATH}"; exit 1
            fi
            config_args+=("--config=${GITLEAKS_CONFIG_PATH}")
          fi
          # The checkout above uses persist-credentials: false, so there is no
          # auth header in .git/config to scrub; --no-git scans the working tree.
          rc=0
          gitleaks detect --source=. --report-path="${REPORT_PATH}" --report-format=json \
            --redact --no-git "${config_args[@]}" || rc=$?
          count=0
          if [ -f "${REPORT_PATH}" ]; then
            count="$(jq 'length' "${REPORT_PATH}" 2>/dev/null || echo 0)"
          fi
          {
            echo "### Secret scanning (gitleaks)"
            echo ""
            if [ "${count}" -eq 0 ]; then
              echo "No secrets detected."
            else
              echo "**${count} finding(s)** (values redacted):"
              echo ""
              jq -r '.[0:20][] | "- `\(.RuleID)` \(.File):\(.StartLine)"' "${REPORT_PATH}" 2>/dev/null || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${rc}"

      - name: Upload gitleaks report (redacted)
        if: ${{ !cancelled() && inputs.gitleaks && inputs['gitleaks-upload-report'] }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json
          retention-days: 7
          if-no-files-found: ignore

      # --- optional markdown danger lint (github#891) -------------------------
      - name: Markdown danger lint
        id: markdown_danger_lint
        if: ${{ !cancelled() && inputs['markdown-danger-lint'] }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGED_LIST: ${{ runner.temp }}/changed_md.txt
        run: |
          set -uo pipefail
          git diff --name-only "${BASE_SHA}"...HEAD -- '*.md' > "${CHANGED_LIST}" || true
          count="$(wc -l < "${CHANGED_LIST}" 2>/dev/null || echo 0)"
          if [ "${count}" -eq 0 ]; then
            echo "No Markdown changed."
            exit 0
          fi
          fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            if grep -nEi 'git\s+push.*(--all.*--force|--force.*--all|--all.*-f\b|-f\b.*--all)' "$f" \
               | grep -viE 'never|do not|nepoužívej|nepouzivej|nepoužij'; then
              echo "Dangerous pattern in $f (git push with --force + --all)."
              fail=1
            fi
          done < "${CHANGED_LIST}"
          if [ "${fail}" -ne 0 ]; then
            echo "::error title=Unsafe git command detected::Found 'git push --force --all' in changed Markdown files."
            exit 1
          fi
          echo "No dangerous patterns found."

      # --- optional PR text length (github#891) -------------------------------
      - name: Check PR text length
        id: pr_text_length
        if: ${{ !cancelled() && inputs['pr-text-length'] }}
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          MAX_TITLE: ${{ inputs['pr-text-max-title'] }}
          MAX_BODY: ${{ inputs['pr-text-max-body'] }}
        run: |
          set -euo pipefail
          # Dependabot bodies are machine-generated changelogs; keeping the limit
          # made every dependabot PR permanently UNSTABLE (2026-07-06).
          if [ "${AUTHOR}" = "dependabot[bot]" ]; then
            echo "dependabot PR — length check waived"
            exit 0
          fi
          title_len="${#TITLE}"
          [ "${title_len}" -le "${MAX_TITLE}" ] || { echo "::error::PR title too long (${title_len} > ${MAX_TITLE})"; exit 1; }
          body_len="$(printf '%s' "${BODY}" | wc -c)"
          [ "${body_len}" -le "${MAX_BODY}" ] || { echo "::error::PR body too long (${body_len} > ${MAX_BODY})"; exit 1; }
          echo "PR text length OK"

      - name: Check gate results
        if: ${{ !cancelled() }}
        env:
          DEPENDENCY_REVIEW: ${{ steps.dependency_review.outcome }}
          PR_METADATA: ${{ steps.pr-data.outcome }}
          PR_TITLE_CHECK: ${{ steps.pr_title.outcome }}
          PR_BRANCH_CHECK: ${{ steps.pr_branch.outcome }}
          PR_SIZE_CHECK: ${{ steps.pr_size.outcome }}
          PR_MERGE_COMMITS: ${{ steps.pr_merge_commits.outcome }}
          DOCS_GOVERNANCE: ${{ steps.docs_governance.outcome }}
          GITLEAKS: ${{ steps.gitleaks.outcome }}
          MARKDOWN_DANGER_LINT: ${{ steps.markdown_danger_lint.outcome }}
          PR_TEXT_LENGTH: ${{ steps.pr_text_length.outcome }}
        run: |
          set -euo pipefail
          rc=0
          # `skipped` is a legitimate outcome (an input switched the check off);
          # only `failure` blocks, exactly as the separate jobs did.
          for pair in \
            "dependency-review:${DEPENDENCY_REVIEW}" \
            "pr-checks/metadata:${PR_METADATA}" \
            "pr-checks/title:${PR_TITLE_CHECK}" \
            "pr-checks/branch:${PR_BRANCH_CHECK}" \
            "pr-checks/size:${PR_SIZE_CHECK}" \
            "pr-checks/merge-commits:${PR_MERGE_COMMITS}" \
            "docs-governance:${DOCS_GOVERNANCE}" \
            "gitleaks:${GITLEAKS}" \
            "markdown-danger-lint:${MARKDOWN_DANGER_LINT}" \
            "pr-text-length:${PR_TEXT_LENGTH}"; do
            name="${pair%%:*}"
            outcome="${pair#*:}"
            if [ "${outcome}" = "failure" ]; then
              echo "::error::${name} failed"
              rc=1
            fi
          done
          if [ "${rc}" -eq 0 ]; then
            echo "pr-gate: OK"
          fi
          exit "${rc}"
