# Security: Gitleaks Secret Scanning
# Reusable workflow for detecting secrets in code
#
# Usage:
#   jobs:
#     gitleaks:
#       uses: merglbot-core/github/.github/workflows/security-gitleaks.yml@<sha>  # vX.Y.Z
#       with:
#         fail-on-detection: true  # Optional: fail if secrets found
#
# Purpose: Detect hardcoded secrets, API keys, tokens before they reach production
# Category: Security
# Priority: HIGH
# Status: DRAFT
# Created: 2025-11-12 (Enterprise CI Audit)

name: Security - Gitleaks

on:
  workflow_call:
    inputs:
      fail-on-detection:
        description: 'Fail the workflow if secrets are detected'
        type: boolean
        default: true
        required: false
      
      config-path:
        description: 'Path to custom gitleaks config file (optional)'
        type: string
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      # codeql-action/upload-sarif reads the workflow run (Actions API). This
      # block is enumerative, so without `actions: read` here the token never
      # carries it, whatever the caller grants (github#805: SARIF silently
      # stopped reaching code scanning). Both remaining callers grant it.
      actions: read
    
    steps:
      - name: Validate config path
        id: config
        shell: bash
        run: |
          set -euo pipefail
          config_path="${{ inputs.config-path }}"
          if [ -z "$config_path" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          case "$config_path" in
            /*|*../*)
              echo "Invalid config-path: $config_path. Use a repository-relative path without '..'." >&2
              exit 1
              ;;
          esac
          
          echo "path=$config_path" >> "$GITHUB_OUTPUT"
      
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1  # scan runs with --no-git (working tree only); full history was never read  # Full history for comprehensive scanning
          persist-credentials: false

      - name: Scrub checkout auth metadata (avoid false positives)
        shell: bash
        run: |
          set -euo pipefail

          # actions/checkout may add temporary auth headers / includeIf credentials.
          # Secret scanners must not treat these as repo leaks.
          if [ -d .git ]; then
            git config --local --unset-all http.https://github.com/.extraheader || true

            # Remove includeIf entries pointing to temporary credential configs.
            # (actions/checkout normally removes these in its post-step, but scanners run before that.)
            while IFS= read -r key; do
              [ -z "$key" ] && continue
              git config --local --unset-all "$key" || true
            done < <(git config --local --name-only --get-regexp '^includeif\.gitdir:' || true)
          fi
      
      - name: Install Gitleaks CLI
        # 8.22.1: 8.18.4/8.19.x emit SARIF endColumn 0 when a match ends on a
        # read-chunk boundary, which upload-sarif rejects (github#1055). 8.23+
        # widens generic-api-key and adds false positives in fail-on-detection
        # callers, so stay on 8.22.x until a caller-wide finding check is done.
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          wget -q -O "$tmp_dir/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.22.1/gitleaks_8.22.1_linux_x64.tar.gz
          echo "2f92ab3b8e08319ac30836c32b90818e01519c3a4982771e4f45a7f5607872f7  $tmp_dir/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$tmp_dir/gitleaks.tgz" -C "$tmp_dir" gitleaks
          sudo mv "$tmp_dir/gitleaks" /usr/local/bin/
          gitleaks version
      
      - name: Run Gitleaks
        id: scan
        run: |
          set -euo pipefail
          config_arg=""
          if [ -n "${{ steps.config.outputs.path }}" ]; then
            config_arg="--config=${{ steps.config.outputs.path }}"
          fi
          
          # Run gitleaks and generate SARIF report
          if [ "${{ inputs.fail-on-detection }}" = "true" ]; then
            gitleaks detect --source=. --report-path=gitleaks-report.sarif --report-format=sarif $config_arg --redact --no-git
          else
            gitleaks detect --source=. --report-path=gitleaks-report.sarif --report-format=sarif $config_arg --redact --no-git || true
          fi

      - name: Summarize findings (redacted)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f gitleaks-report.sarif ]; then
            echo "## Gitleaks results (redacted)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- No SARIF report found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "## Gitleaks results (redacted)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          findings_count="$(jq -r '(.runs[0].results // []) | length' gitleaks-report.sarif 2>/dev/null || echo 0)"
          echo "- Findings: **${findings_count}**" >> "$GITHUB_STEP_SUMMARY"

          jq -r '
            (.runs[0].results // [])[0:20][] |
            "- `\(.ruleId // "unknown")` — `\((.locations[0].physicalLocation.artifactLocation.uri // "unknown"))\(
              if ((.locations[0].physicalLocation.region.startLine // null) | type) == "number"
              then ":" + (.locations[0].physicalLocation.region.startLine | tostring)
              else ""
              end
            )`"
          ' gitleaks-report.sarif >> "$GITHUB_STEP_SUMMARY" || true

          if [ "${findings_count}" -gt 20 ]; then
            echo "- … plus $((findings_count - 20)) more" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Drop invalid SARIF end positions
        # A scanner bug must not fail the required check (github#1055): a region
        # whose endColumn is below 1 keeps its start and loses only the end.
        if: ${{ !cancelled() && hashFiles('gitleaks-report.sarif') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          invalid="$(jq '[.runs[].results[]?.locations[]?.physicalLocation.region | select(. != null and (.endColumn // 1) < 1)] | length' gitleaks-report.sarif)"
          if [ "$invalid" -gt 0 ]; then
            echo "::warning::gitleaks SARIF had $invalid region(s) with endColumn < 1; end position dropped before upload"
            jq '(.runs[].results[]?.locations[]?.physicalLocation.region | select(. != null and (.endColumn // 1) < 1)) |= del(.endColumn, .endLine)' gitleaks-report.sarif > gitleaks-report.fixed.sarif
            mv gitleaks-report.fixed.sarif gitleaks-report.sarif
          fi

      - name: Upload gitleaks report (SARIF, redacted)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: gitleaks-report-sarif
          path: gitleaks-report.sarif
          if-no-files-found: ignore
          retention-days: 7
      
      - name: Upload SARIF report
        # No continue-on-error: a failed upload must turn the check red, or the
        # check colour says nothing about persistence (github#805). Skipped when
        # the scan produced no SARIF file.
        if: ${{ !cancelled() && hashFiles('gitleaks-report.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: gitleaks-report.sarif
          category: gitleaks
          token: ${{ github.token }}
      
      - name: Comment on PR (if secrets found)
        # Bound to the scan step itself: an upload failure must not post a
        # "secrets detected" comment (github#805).
        if: ${{ !cancelled() && steps.scan.outcome == 'failure' && github.event.pull_request.number }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const pullRequestNumber = context.payload.pull_request?.number;
            if (!pullRequestNumber) {
              core.warning('No pull_request context available. Skipping comment.');
              return;
            }
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequestNumber,
              body: '🔐 **Gitleaks detected potential secrets in this PR!**\n\n' +
                    'Please review the workflow run and remove any hardcoded secrets.\n' +
                    'Use `${{ secrets.SECRET_NAME }}` instead of hardcoded values.\n\n' +
                    'See: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            })
