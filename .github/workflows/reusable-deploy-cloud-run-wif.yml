name: Deploy to Cloud Run (WIF)

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Cloud Run service name'
        required: true
        type: string
      region:
        description: 'GCP region'
        required: false
        type: string
        default: 'europe-west1'
      image_name:
        description: 'Container image name (without registry prefix)'
        required: true
        type: string
      deploy_project_id:
        description: 'Cloud Run deploy project ID (defaults to secret GCP_PROJECT_ID)'
        required: false
        type: string
        default: ''
      artifact_project_id:
        description: 'Artifact Registry project ID (defaults to deploy project)'
        required: false
        type: string
        default: ''
      artifact_location:
        description: 'Artifact Registry location (defaults to Cloud Run region)'
        required: false
        type: string
        default: ''
      artifact_repository:
        description: 'Artifact Registry repository name'
        required: false
        type: string
        default: 'containers'
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: 'Dockerfile'
      environment_name:
        description: 'GitHub Environment name for the deploy job'
        required: false
        type: string
        default: ''
      environment_url:
        description: 'Optional GitHub Environment URL for the deploy job'
        required: false
        type: string
        default: ''
      runtime_service_account:
        description: 'Optional runtime service account email for Cloud Run'
        required: false
        type: string
        default: ''
      wif_provider:
        description: 'Optional WIF provider when caller stores auth metadata in vars'
        required: false
        type: string
        default: ''
      wif_service_account:
        description: 'Optional WIF service account when caller stores auth metadata in vars'
        required: false
        type: string
        default: ''
      ingress:
        description: 'Cloud Run ingress setting'
        required: false
        type: string
        default: ''
      memory:
        description: 'Optional Cloud Run memory allocation override'
        required: false
        type: string
        default: ''
      cpu:
        description: 'Optional Cloud Run CPU allocation override'
        required: false
        type: string
        default: ''
      timeout:
        description: 'Optional Cloud Run request timeout override in seconds'
        required: false
        type: number
        default: 0
      port:
        description: 'Optional Cloud Run container port override'
        required: false
        type: number
        default: 0
      allow_unauthenticated:
        description: 'Allow unauthenticated access to the deployed service (true = public internet access). REQUIRED: callers must set this explicitly.'
        required: true
        type: boolean
      environment:
        description: 'Environment (staging/production)'
        required: false
        type: string
        default: 'staging'
      min_instances:
        description: 'Minimum instances'
        required: false
        type: number
        default: 0
      max_instances:
        description: 'Maximum instances'
        required: false
        type: number
        default: 10
      debounce_environment:
        description: 'Dedicated preconfigured environment with a 10-minute wait timer; owner activation required'
        type: string
        required: false
        default: ''
      staged_health_path:
        description: 'Explicit HTTP startup endpoint for a no-traffic rollout; requires caller contract and protected activation'
        type: string
        required: false
        default: ''
      # --- gcloud (github#963, EPIC merglbot-core/platform#1722) ---
      # GitHub-hosted ubuntu runners preinstall the Google Cloud SDK, and
      # google-github-actions/auth writes the credentials it finds. Set false to
      # skip the 20-40 s setup-gcloud step when no specific gcloud version or
      # extra component is needed (this workflow only runs GA `gcloud auth`,
      # `gcloud run` and `gcloud artifacts` commands). Default true keeps today's behaviour.
      env_vars:
        description: 'Optional comma-separated NAME=value list, set together with ENVIRONMENT (replaces the service env, like the secrets-based variant). Plain values only; secrets are not passed here.'
        required: false
        type: string
        default: ''
      env_update:
        description: 'Merge env_vars into the live service env with --update-env-vars instead of replacing it (github#709). ENVIRONMENT is then not injected and variables not listed keep their live value.'
        required: false
        type: boolean
        default: false
      secret_env:
        description: 'Optional newline-separated NAME=SECRET[:VERSION] list merged with --update-secrets (github#709). SECRET is a Secret Manager id in the deploy project or projects/<number>/secrets/<id>; VERSION defaults to latest. References only, never values; blank and # lines are ignored.'
        required: false
        type: string
        default: ''
      install_gcloud:
        description: 'Install gcloud via google-github-actions/setup-gcloud (false = use the runner-preinstalled SDK)'
        type: boolean
        default: true
        required: false
    secrets:
      WIF_PROVIDER:
        description: 'Workload Identity Federation provider'
        required: false
      WIF_SERVICE_ACCOUNT:
        description: 'Service account email for WIF'
        required: false
      GCP_PROJECT_ID:
        description: 'GCP Project ID'
        required: false
      NODE_AUTH_TOKEN:
        description: 'Optional token exposed to docker build as the node_auth_token BuildKit secret, for a Dockerfile that installs private GitHub Packages (github#709). Pass the caller job github.token with packages: read; it never reaches the image or the logs.'
        required: false

concurrency:
  # Secrets are unavailable here: conservatively serialize both project paths.
  group: deploy-wif-${{ github.repository }}-${{ inputs.region }}-${{ inputs.service_name }}
  cancel-in-progress: false

jobs:
  debounce:
    if: ${{ inputs.debounce_environment != '' }}
    environment: ${{ inputs.debounce_environment || inputs.environment }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.admit.outputs.eligible }}
    steps:
      - name: Verify native wait timer and current green CI head
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          DEBOUNCE_ENVIRONMENT: ${{ inputs.debounce_environment }}
        run: |
          set -euo pipefail
          # BEGIN deploy-debounce-admission
          echo 'eligible=false' >> "$GITHUB_OUTPUT"
          # No runner sleep: GitHub waits before allocating this job's runner.
          encoded=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["DEBOUNCE_ENVIRONMENT"], safe=""))')
          gh api "repos/$GITHUB_REPOSITORY/environments/$encoded" > "$RUNNER_TEMP/debounce-environment.json"
          python3 - "$RUNNER_TEMP/debounce-environment.json" "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/debounce-trigger-head" <<'DEBOUNCE_PY'
          import json, os, re, sys
          with open(sys.argv[1]) as stream:
              environment = json.load(stream)
          timers = [rule.get('wait_timer') for rule in environment.get('protection_rules', [])
                    if rule.get('type') == 'wait_timer']
          if timers != [10]:
              raise SystemExit('Expected exactly one native ten-minute environment wait timer')
          with open(sys.argv[2]) as stream:
              event = json.load(stream)
          run = event.get('workflow_run', {})
          if not (os.environ.get('GITHUB_EVENT_NAME') == 'workflow_run'
                  and run.get('event') == 'push' and run.get('conclusion') == 'success'
                  and run.get('head_branch') == 'main' and run.get('name') == 'ci'
                  and isinstance(run.get('head_sha'), str)
                  and re.fullmatch(r'[0-9a-f]{40}', run['head_sha'])
                  and run.get('head_repository', {}).get('full_name') == os.environ['GITHUB_REPOSITORY']
                  and type(run.get('id')) is int):
              raise SystemExit('Debounced rollout requires this repository current green main push CI run')
          print(run['head_sha'])
          DEBOUNCE_PY
          # workflow_run's GITHUB_SHA can already be a newer main commit.
          # A valid but superseded successful trigger is an intentional skip.
          if [[ "$(cat "$RUNNER_TEMP/debounce-trigger-head")" != "$GITHUB_SHA" ]]; then
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/debounce-own-run.json"
          python3 - "$RUNNER_TEMP/debounce-own-run.json" <<'DEBOUNCE_AGE_PY'
          import datetime, json, os, sys
          with open(sys.argv[1]) as stream:
              run = json.load(stream)
          created = datetime.datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
          age = (datetime.datetime.now(datetime.timezone.utc) - created).total_seconds()
          if not (created.tzinfo is not None and age >= 600
                  and run.get('head_sha') == os.environ['GITHUB_SHA']
                  and run.get('event') == 'workflow_run'):
              raise SystemExit('Ten-minute quiet period is not proven; no runner sleep or timer bypass')
          DEBOUNCE_AGE_PY
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo 'Superseded by a newer main head; no build or deploy.'
            exit 0
          fi
          ci_run=$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["workflow_run"]["id"])')
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run" > "$RUNNER_TEMP/debounce-ci.json"
          python3 - "$RUNNER_TEMP/debounce-ci.json" <<'DEBOUNCE_CI_PY'
          import json, os, sys
          with open(sys.argv[1]) as stream:
              run = json.load(stream)
          if not (run.get('head_sha') == os.environ['GITHUB_SHA']
                  and run.get('head_branch') == 'main' and run.get('event') == 'push'
                  and run.get('status') == 'completed' and run.get('conclusion') == 'success'
                  and run.get('name') == 'ci'
                  and run.get('head_repository', {}).get('full_name') == os.environ['GITHUB_REPOSITORY']):
              raise SystemExit('Live CI run no longer permits deployment')
          DEBOUNCE_CI_PY
          echo 'eligible=true' >> "$GITHUB_OUTPUT"
          # END deploy-debounce-admission

  build-and-deploy:
    needs: debounce
    if: ${{ !cancelled() && (inputs.debounce_environment == '' || needs.debounce.outputs.eligible == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # Build, scan, and deploy usually <15m; buffer for registry latency
    environment:
      name: ${{ inputs.environment_name != '' && inputs.environment_name || inputs.environment }}
      url: ${{ inputs.environment_url != '' && inputs.environment_url || '' }}
    permissions:
      contents: read
      id-token: write  # Required for WIF OIDC token
      security-events: write  # Needed for SARIF upload
      actions: read  # Native debounce verifies the original CI run

    steps:
      - name: Revalidate head after debounce and environment admission
        if: ${{ inputs.debounce_environment != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [ "$current" = "$GITHUB_SHA" ] || { echo 'Main advanced; refuse stale build.' >&2; exit 1; }
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve WIF parameters
        id: wif
        shell: bash
        env:
          INPUT_WIF_PROVIDER: ${{ inputs.wif_provider }}
          INPUT_WIF_SERVICE_ACCOUNT: ${{ inputs.wif_service_account }}
          SECRET_WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          SECRET_WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          # Canonical provider is intentionally pinned to the platform SSOT.
          SSOT_WIF_PROVIDER="projects/671585034644/locations/global/workloadIdentityPools/github-actions/providers/github-oidc"

          echo "::add-mask::$INPUT_WIF_PROVIDER"
          echo "::add-mask::$INPUT_WIF_SERVICE_ACCOUNT"
          echo "::add-mask::$SECRET_WIF_PROVIDER"
          echo "::add-mask::$SECRET_WIF_SERVICE_ACCOUNT"

          WIF_PROVIDER="${INPUT_WIF_PROVIDER:-$SECRET_WIF_PROVIDER}"
          WIF_SERVICE_ACCOUNT="${INPUT_WIF_SERVICE_ACCOUNT:-$SECRET_WIF_SERVICE_ACCOUNT}"

          if [ -z "$WIF_PROVIDER" ]; then
            echo "::error::wif_provider is empty and secret WIF_PROVIDER is not set"
            exit 1
          fi

          if [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "::error::wif_service_account is empty and secret WIF_SERVICE_ACCOUNT is not set"
            exit 1
          fi

          if [ "$WIF_PROVIDER" != "$SSOT_WIF_PROVIDER" ]; then
            echo "::error::wif_provider must point to the SSOT provider in merglbot-seed (${SSOT_WIF_PROVIDER})."
            exit 1
          fi

          if [[ "$WIF_SERVICE_ACCOUNT" == *@merglbot.iam.gserviceaccount.com ]]; then
            echo "::error::wif_service_account points to a legacy service account in the DELETE_REQUESTED 'merglbot' project."
            exit 1
          fi

          echo "::add-mask::$WIF_PROVIDER"
          echo "::add-mask::$WIF_SERVICE_ACCOUNT"

          {
            printf 'wif_provider=%s\n' "$WIF_PROVIDER"
            printf 'wif_service_account=%s\n' "$WIF_SERVICE_ACCOUNT"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP (WIF)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ steps.wif.outputs.wif_provider }}
          service_account: ${{ steps.wif.outputs.wif_service_account }}
          token_format: 'access_token'

      - name: Resolve deployment parameters
        id: deploy-params
        shell: bash
        env:
          INPUT_DEPLOY_PROJECT_ID: ${{ inputs.deploy_project_id }}
          INPUT_ARTIFACT_PROJECT_ID: ${{ inputs.artifact_project_id }}
          INPUT_ARTIFACT_LOCATION: ${{ inputs.artifact_location }}
          INPUT_ARTIFACT_REPOSITORY: ${{ inputs.artifact_repository }}
          INPUT_REGION: ${{ inputs.region }}
          SECRET_GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail

          DEPLOY_PROJECT_ID="${INPUT_DEPLOY_PROJECT_ID:-$SECRET_GCP_PROJECT_ID}"
          ARTIFACT_PROJECT_ID="${INPUT_ARTIFACT_PROJECT_ID:-$DEPLOY_PROJECT_ID}"
          ARTIFACT_LOCATION="${INPUT_ARTIFACT_LOCATION:-$INPUT_REGION}"
          ARTIFACT_REPOSITORY="${INPUT_ARTIFACT_REPOSITORY}"

          if [ -z "$DEPLOY_PROJECT_ID" ]; then
            echo "::error::deploy_project_id is empty and secret GCP_PROJECT_ID is not set"
            exit 1
          fi

          if [ -z "$ARTIFACT_PROJECT_ID" ]; then
            echo "::error::artifact_project_id could not be resolved"
            exit 1
          fi

          if [ -z "$ARTIFACT_LOCATION" ]; then
            echo "::error::artifact_location could not be resolved"
            exit 1
          fi

          if [ -z "$ARTIFACT_REPOSITORY" ]; then
            echo "::error::artifact_repository could not be resolved"
            exit 1
          fi

          {
            printf 'DEPLOY_PROJECT_ID=%s\n' "$DEPLOY_PROJECT_ID"
            printf 'ARTIFACT_PROJECT_ID=%s\n' "$ARTIFACT_PROJECT_ID"
            printf 'ARTIFACT_LOCATION=%s\n' "$ARTIFACT_LOCATION"
            printf 'ARTIFACT_REPOSITORY=%s\n' "$ARTIFACT_REPOSITORY"
          } >> "$GITHUB_ENV"

      - name: Setup gcloud CLI
        if: ${{ inputs.install_gcloud }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
        with:
          project_id: ${{ env.DEPLOY_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${ARTIFACT_LOCATION}-docker.pkg.dev" --quiet

      - name: Build Container Image
        id: build
        env:
          INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ github.sha }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          IMAGE_BASE="${ARTIFACT_LOCATION}-docker.pkg.dev/${ARTIFACT_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${INPUT_IMAGE_NAME}"
          # github#709: a caller-provided token is a BuildKit secret (never a build arg or layer).
          build_image() {
            if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
              docker build --secret id=node_auth_token,env=NODE_AUTH_TOKEN -t "$1" -f "$INPUT_DOCKERFILE" .
            else
              docker build -t "$1" -f "$INPUT_DOCKERFILE" .
            fi
          }
          # Provenance (github#909): this workflow does not sign its images, so an existing
          # tag carries no evidence of who pushed it and is never adopted; it is rebuilt and
          # pushed (an immutable repository refuses that, as before github#909).
          adoptable() { return 1; }
          # BEGIN image-publish
          # Idempotent (github#909): the tag is the commit SHA, so an existing tag whose
          # digest passes `adoptable` (defined per workflow above) is adopted, never rebuilt
          # or re-pushed (immutable repos reject a re-push). The registry repository can be
          # shared with other repos' deploy identities, so a tag without that evidence is
          # rebuilt from this commit and pushed like an absent one: an immutable repository
          # refuses that push, a mutable one takes this build. Only the verified digest is used.
          ref="${IMAGE_BASE}:${IMAGE_TAG}"
          IMAGE_DIGEST=""
          pulled_digest() {  # digest of the locally pulled ${ref} in this repository, or empty
            local line digests
            digests="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$ref")" || return 0
            while IFS= read -r line; do
              if [[ $line == "${IMAGE_BASE}@sha256:"* ]]; then printf '%s\n' "${line#"${IMAGE_BASE}@"}"; return 0; fi
            done <<< "$digests"
          }
          probe_rc=0
          probe_out="$(docker pull --quiet "$ref" 2>&1)" || probe_rc=$?
          existing=""
          if [ "$probe_rc" -eq 0 ]; then
            existing="$(pulled_digest)"
            if [ -z "$existing" ]; then
              echo "::error::Pulled ${ref} but could not resolve its digest in this repository; not guessing."
              exit 1
            fi
          fi
          if [ -n "$existing" ] && adoptable "${IMAGE_BASE}@${existing}"; then
            IMAGE_ADOPTED=true
            IMAGE_DIGEST="$existing"
            echo "::notice::Image tag ${ref} already exists with verified provenance; adopting ${existing} (no rebuild, no push)."
          elif [ "$probe_rc" -ne 0 ] && [[ $probe_out =~ (denied|unauthorized|forbidden|toomanyrequests) ]]; then
            printf '%s\n' "$probe_out" >&2
            echo "::error::Probing ${ref} was refused; not guessing whether the tag exists."
            exit 1
          elif [ "$probe_rc" -eq 0 ] || [[ $probe_out =~ (manifest\ unknown|MANIFEST_UNKNOWN|manifest\ for\ [^[:space:]]+\ not\ found|failed\ to\ resolve\ reference\ .*:\ not\ found) ]]; then
            if [ "$probe_rc" -eq 0 ]; then
              echo "::notice::Image tag ${ref} exists without verified provenance; rebuilding it from this commit and pushing."
            fi
            IMAGE_ADOPTED=false
            build_image "$ref"
            push_rc=0
            push_out="$(docker push "$ref" 2>&1)" || push_rc=$?
            printf '%s\n' "$push_out"
            if [ "$push_rc" -ne 0 ]; then
              # A concurrent deploy of the same commit may have published the tag between the
              # probe and this push (an immutable repository then refuses the push): probe the
              # exact tag once more and adopt it only when it exists now with verified
              # provenance; anything else fails.
              reprobe_rc=0
              reprobe_out="$(docker pull --quiet "$ref" 2>&1)" || reprobe_rc=$?
              if [ "$reprobe_rc" -ne 0 ]; then
                printf '%s\n' "$reprobe_out" >&2
                echo "::error::docker push ${ref} failed (exit ${push_rc}) and the tag does not exist."
                exit 1
              fi
              existing="$(pulled_digest)"
              if [ -z "$existing" ] || ! adoptable "${IMAGE_BASE}@${existing}"; then
                echo "::error::docker push ${ref} failed (exit ${push_rc}); the tag exists without verified provenance, so it is not adopted."
                exit 1
              fi
              IMAGE_ADOPTED=true
              IMAGE_DIGEST="$existing"
              echo "::notice::docker push ${ref} failed, but the tag exists now with verified provenance (concurrent publication); adopting ${existing}."
            elif [[ $push_out =~ digest:\ (sha256:[0-9a-f]{64}) ]]; then
              IMAGE_DIGEST="${BASH_REMATCH[1]}"
            fi
          else
            printf '%s\n' "$probe_out" >&2
            echo "::error::Unexpected result probing ${ref} (exit ${probe_rc}); not guessing whether the tag exists."
            exit 1
          fi
          # Both paths: fall back to the local RepoDigests of this exact repository.
          attempt=0
          while [ -z "$IMAGE_DIGEST" ] && [ "$attempt" -lt 5 ]; do
            attempt=$((attempt + 1))
            repo_digests="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$ref")" || repo_digests=""
            while IFS= read -r line; do
              if [[ $line == "${IMAGE_BASE}@"* ]]; then
                IMAGE_DIGEST="${line#"${IMAGE_BASE}@"}"
                break
              fi
            done <<< "$repo_digests"
            if [ -z "$IMAGE_DIGEST" ]; then sleep 2; fi
          done
          if ! [[ $IMAGE_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to resolve a sha256 digest for ${ref} (got '${IMAGE_DIGEST}')."
            exit 1
          fi
          IMAGE_REF="${IMAGE_BASE}@${IMAGE_DIGEST}"
          # END image-publish

          # Scan + deploy by immutable digest instead of the mutable :<sha> tag
          # (tag can be re-pushed in the registry; the digest cannot).
          echo "IMAGE=${IMAGE_REF}" >> "$GITHUB_ENV"
          echo "adopted=${IMAGE_ADOPTED}" >> "$GITHUB_OUTPUT"
          echo "✅ Image ready: ${IMAGE_REF} (tag: ${IMAGE_TAG}, adopted: ${IMAGE_ADOPTED})"

      # Container Security: Trivy scan
      # - SARIF is non-blocking (Code Scanning visibility)
      # - Separate gate blocks deploy on CRITICAL (no gating softening)
      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.34.1
        continue-on-error: true
        with:
          version: 'v0.69.3'
          image-ref: ${{ env.IMAGE }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          limit-severities-for-sarif: true
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy vulnerability scanner (gate)
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.34.1
        with:
          version: 'v0.69.3'
          image-ref: ${{ env.IMAGE }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Materialize pinned staging policy
        id: staged_policy
        if: ${{ inputs.staged_health_path != '' }}
        env:
          STAGED_POLICY_FILE: ${{ runner.temp }}/merglbot-staged-policy.py
        run: |
          set -euo pipefail
          # Source is part of the reviewed hub, never the caller checkout.
          cat > "$STAGED_POLICY_FILE" <<'STAGED_POLICY_PY'
          # BEGIN staged-policy-source
          #!/usr/bin/env python3
          """Fail-closed, offline traffic and revision checks for a staged Cloud Run rollout.

          This module performs no API calls or mutations. Callers must collect fresh service
          and revision documents immediately before promotion, under their deployment lock.
          It does not replace the workflow's CI, image-provenance or authority checks.
          """
          from __future__ import annotations

          import re
          import argparse
          import json
          from pathlib import Path


          class Refused(ValueError):
              """The supplied evidence does not authorize the proposed traffic change."""


          def require(value, message):
              if not value:
                  raise Refused(message)


          def verify_access(service, iam, requested):
              """Check existing anonymous invocation without changing service-wide IAM.

              Conditional or nonstandard public grants need a separately reviewed access
              contract. An absent bindings list is a valid empty get-iam-policy response.
              """
              require(requested in ("true", "false"), "invalid requested access state")
              require(isinstance(iam, dict), "invalid IAM policy")
              bindings = iam.get("bindings", [])
              require(isinstance(bindings, list), "invalid IAM bindings")
              disabled = service.get("metadata", {}).get("annotations", {}).get(
                  "run.googleapis.com/invoker-iam-disabled", "false")
              require(disabled in ("true", "false"), "unknown invoker IAM check state")
              public = disabled == "true"
              for binding in bindings:
                  require(isinstance(binding, dict), "invalid IAM binding")
                  members = binding.get("members")
                  require(isinstance(members, list) and all(isinstance(m, str) for m in members)
                          and isinstance(binding.get("role"), str), "invalid IAM grant")
                  if "allUsers" in members:
                      require(binding["role"] == "roles/run.invoker" and not binding.get("condition"),
                              "ambiguous anonymous access grant")
                      public = True
              require(public == (requested == "true"),
                      "existing access differs; separate authorized IAM change required")
              return {"anonymous_invocation": public, "iam_mutation": False}


          def serving_state(service):
              """Resolve LATEST from status, never preserve a movable alias as rollback."""
              metadata = service.get("metadata", {})
              status = service.get("status", {})
              require(metadata.get("name") and metadata.get("uid"), "missing service identity")
              require(metadata.get("generation") == status.get("observedGeneration")
                      and metadata.get("generation") is not None, "unobserved service generation")
              conditions = {c.get("type"): c.get("status") for c in status.get("conditions", [])}
              require(conditions.get("RoutesReady") == "True", "serving routes not Ready")
              traffic = status.get("traffic")
              require(isinstance(traffic, list) and traffic, "missing resolved traffic")
              split, tags = {}, {}
              for target in traffic:
                  revision = target.get("revisionName")
                  require(isinstance(revision, str) and re.fullmatch(r"[a-z][a-z0-9-]*", revision),
                          "unresolved revision identity")
                  percent = target.get("percent", 0)
                  require(type(percent) is int and 0 <= percent <= 100, "invalid traffic percentage")
                  if percent:
                      split[revision] = split.get(revision, 0) + percent
                  if "tag" in target:
                      tag = target["tag"]
                      require(isinstance(tag, str) and tag and tag not in tags, "ambiguous traffic tag")
                      tags[tag] = revision
              require(sum(split.values()) == 100, "traffic is not fully resolved")
              annotations = metadata.get("annotations", {})
              return {
                  "service": metadata["name"], "uid": metadata["uid"],
                  "namespace": metadata.get("namespace"),
                  "split": dict(sorted(split.items())), "tags": dict(sorted(tags.items())),
                  "ingress": annotations.get("run.googleapis.com/ingress"),
                  "default_url_disabled": annotations.get("run.googleapis.com/default-url-disabled"),
              }


          def promotion_plan(before, current, revision, *, expected_revision, expected_image,
                             health_path, port=8080):
              """Require exact-image HTTP startup success and unchanged serving traffic.

              HTTP startup checks exercise the container without opening a private ingress.
              They prove the configured startup endpoint, not an end-to-end business flow.
              No LATEST-based promotion or automatic rollback of foreign traffic is emitted.
              """
              original, live = serving_state(before), serving_state(current)
              require(original == live, "serving identity, traffic, tags or ingress changed")
              require(isinstance(expected_image, str)
                      and re.fullmatch(r"[^\s@]+@sha256:[0-9a-f]{64}", expected_image),
                      "expected image must be pinned to its digest")
              require(isinstance(health_path, str) and re.fullmatch(r"/[A-Za-z0-9_./-]+", health_path),
                      "invalid health path")
              require(type(port) is int and 1 <= port <= 65535, "invalid health port")
              metadata, status = revision.get("metadata", {}), revision.get("status", {})
              require(metadata.get("name") == expected_revision, "foreign revision")
              require(metadata.get("labels", {}).get("serving.knative.dev/service") == live["service"],
                      "foreign service revision")
              require(metadata.get("namespace") == live["namespace"] and live["namespace"],
                      "foreign or missing project namespace")
              require(current.get("status", {}).get("latestCreatedRevisionName") == expected_revision,
                      "candidate superseded")
              require(current.get("status", {}).get("latestReadyRevisionName") == expected_revision,
                      "candidate is not latest Ready")
              require(metadata.get("generation") == status.get("observedGeneration")
                      and metadata.get("generation") is not None, "unobserved revision generation")
              require(status.get("imageDigest") == expected_image, "revision image mismatch")
              conditions = {c.get("type"): c.get("status") for c in status.get("conditions", [])}
              require(all(conditions.get(key) == "True" for key in ("Ready", "ContainerHealthy")),
                      "candidate startup not successful")
              containers = revision.get("spec", {}).get("containers", [])
              require(len(containers) == 1, "multi-container health requires a separate contract")
              probe = containers[0].get("startupProbe", {})
              require(probe.get("httpGet") == {"path": health_path, "port": port},
                      "HTTP startup endpoint mismatch")
              require("tcpSocket" not in probe and "grpc" not in probe, "ambiguous startup probe")
              expected_probe = {"initialDelaySeconds": 0, "failureThreshold": 24,
                                "timeoutSeconds": 5, "periodSeconds": 10}
              require(all(type(probe.get(field, 0 if field == "initialDelaySeconds" else None)) is int
                          and probe.get(field, 0 if field == "initialDelaySeconds" else None) == value
                          for field, value in expected_probe.items()), "startup timing contract mismatch")
              return {
                  "revision": expected_revision, "image": expected_image,
                  "promote_argument": f"{expected_revision}=100",
                  "rollback_argument": ",".join(f"{name}={percent}" for name, percent in original["split"].items()),
                  "preserve_tags": original["tags"],
                  "health_scope": "exact_revision_http_startup_only",
                  "requires_fresh_readback_and_deployment_lock": True,
              }


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--before", type=Path, required=True)
              parser.add_argument("--snapshot", action="store_true")
              parser.add_argument("--iam-policy", type=Path)
              parser.add_argument("--requested-public", choices=("true", "false"))
              parser.add_argument("--current", type=Path)
              parser.add_argument("--revision", type=Path)
              parser.add_argument("--expected-revision")
              parser.add_argument("--expected-image")
              parser.add_argument("--health-path")
              parser.add_argument("--health-port", type=int, default=8080)
              args = parser.parse_args()
              try:
                  if args.iam_policy:
                      print(json.dumps(verify_access(json.loads(args.before.read_text()),
                                                    json.loads(args.iam_policy.read_text()),
                                                    args.requested_public), sort_keys=True))
                      return
                  if args.snapshot:
                      print(json.dumps(serving_state(json.loads(args.before.read_text())), sort_keys=True))
                      return
                  require(all((args.current, args.revision, args.expected_revision,
                               args.expected_image, args.health_path)), "incomplete promotion arguments")
                  plan = promotion_plan(*(json.loads(p.read_text()) for p in
                                          (args.before, args.current, args.revision)),
                                        expected_revision=args.expected_revision,
                                        expected_image=args.expected_image, health_path=args.health_path,
                                        port=args.health_port)
              except (Refused, ValueError, KeyError, TypeError, OSError) as error:
                  parser.exit(1, f"Staged rollout refused: {error}\n")
              print(json.dumps(plan, sort_keys=True))


          if __name__ == "__main__":
              main()
          # END staged-policy-source
          STAGED_POLICY_PY

      - name: Deploy to Cloud Run
        env:
          STAGED_HEALTH_PATH: ${{ inputs.staged_health_path }}
          DEBOUNCE_ENVIRONMENT: ${{ inputs.debounce_environment }}
          GH_TOKEN: ${{ github.token }}
          STAGED_POLICY_FILE: ${{ runner.temp }}/merglbot-staged-policy.py
          STAGED_REQUESTED_PUBLIC: ${{ inputs.allow_unauthenticated }}
          INPUT_SERVICE_NAME: ${{ inputs.service_name }}
          INPUT_REGION: ${{ inputs.region }}
          INPUT_ENVIRONMENT: ${{ inputs.environment_name != '' && inputs.environment_name || inputs.environment }}
          INPUT_MIN_INSTANCES: ${{ inputs.min_instances }}
          INPUT_MAX_INSTANCES: ${{ inputs.max_instances }}
          INPUT_TIMEOUT: ${{ inputs.timeout }}
          INPUT_PORT: ${{ inputs.port }}
          INPUT_RUNTIME_SERVICE_ACCOUNT: ${{ inputs.runtime_service_account }}
          INPUT_INGRESS: ${{ inputs.ingress }}
          INPUT_MEMORY: ${{ inputs.memory }}
          INPUT_CPU: ${{ inputs.cpu }}
          INPUT_ALLOW_UNAUTHENTICATED: ${{ inputs.allow_unauthenticated }}
          INPUT_ENV_VARS: ${{ inputs.env_vars }}
          INPUT_ENV_UPDATE: ${{ inputs.env_update }}
          INPUT_SECRET_ENV: ${{ inputs.secret_env }}
        run: |
          set -euo pipefail

          SERVICE="$INPUT_SERVICE_NAME"
          REGION="$INPUT_REGION"
          PROJECT_ID="$DEPLOY_PROJECT_ID"
          STAGED_IMAGE="$IMAGE"
          STAGE_DIR=""
          trap '[ -z "$STAGE_DIR" ] || rm -rf "$STAGE_DIR"' EXIT

          if [ -n "$STAGED_HEALTH_PATH" ]; then
            [[ "$INPUT_PORT" =~ ^[0-9]+$ ]] || exit 1
            [ "$INPUT_PORT" -le 65535 ] || exit 1
          fi

          # BEGIN stage-prepare
          if [ -n "$STAGED_HEALTH_PATH" ]; then
            [[ "$STAGED_HEALTH_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]] || exit 1
            [[ "$STAGED_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]] || exit 1
            [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || exit 1
            STAGE_DIR=$(mktemp -d)
            STAGE_SUFFIX="r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            STAGE_CANDIDATE="${SERVICE}-${STAGE_SUFFIX}-base"
            [ "${#STAGE_CANDIDATE}" -le 63 ] || exit 1
            cp "$STAGED_POLICY_FILE" "$STAGE_DIR/policy.py"
            gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format=json > "$STAGE_DIR/before.json"
            python3 "$STAGE_DIR/policy.py" --before "$STAGE_DIR/before.json" --snapshot > "$STAGE_DIR/rollback.json"
            gcloud run services get-iam-policy "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format=json > "$STAGE_DIR/iam.json"
            python3 "$STAGE_DIR/policy.py" --before "$STAGE_DIR/before.json" --iam-policy "$STAGE_DIR/iam.json" --requested-public "$STAGED_REQUESTED_PUBLIC" > "$STAGE_DIR/access.json"
            # No mutation until rollback and existing access have been validated.
          fi
          # END stage-prepare

          # A no-traffic rollout must not change service-wide ingress first.
          if [ -n "$STAGED_HEALTH_PATH" ] && [ -n "$INPUT_INGRESS" ]; then
            python3 - "$STAGE_DIR/before.json" "$INPUT_INGRESS" <<'INGRESS_PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              before = json.load(stream)
          current = before.get('metadata', {}).get('annotations', {}).get('run.googleapis.com/ingress')
          if current != sys.argv[2]:
              raise SystemExit('Staged deploy refuses an ingress change or missing ingress evidence')
          INGRESS_PY
          fi

          NORMALIZED_DEPLOY_ENVIRONMENT="$(printf '%s' "${INPUT_ENVIRONMENT}" | tr '[:upper:]' '[:lower:]')"

          # github#709: callers of the secrets-based variant pass plain env vars; accept the same
          # comma-separated NAME=value list. --set-env-vars REPLACES the service env, so the list
          # must be complete. Names are validated; values may not contain a comma or newline.
          ENV_VARS="ENVIRONMENT=${INPUT_ENVIRONMENT}"
          if [ -n "${INPUT_ENV_VARS}" ]; then
            if [[ "${INPUT_ENV_VARS}" == *$'\n'* ]]; then
              echo "::error::env_vars must be one comma-separated line"
              exit 1
            fi
            IFS=',' read -r -a ENV_PAIRS <<< "${INPUT_ENV_VARS}"
            for pair in "${ENV_PAIRS[@]}"; do
              if ! [[ "${pair}" =~ ^[A-Za-z_][A-Za-z0-9_]*=.*$ ]]; then
                echo "::error::env_vars entry is not NAME=value: '${pair%%=*}'"
                exit 1
              fi
              if [ "${pair%%=*}" = "ENVIRONMENT" ]; then
                echo "::error::env_vars must not set ENVIRONMENT; use the environment input"
                exit 1
              fi
            done
            ENV_VARS="${ENV_VARS},${INPUT_ENV_VARS}"
          fi
          # github#709: env_update=true merges the listed variables into the live env
          # (--update-env-vars) and injects no ENVIRONMENT, so unlisted variables survive.
          if [ "${INPUT_ENV_UPDATE:-false}" = "true" ]; then
            ENV_FLAGS=()
            [ -z "${INPUT_ENV_VARS}" ] || ENV_FLAGS=("--update-env-vars=${INPUT_ENV_VARS}")
          else
            ENV_FLAGS=("--set-env-vars=${ENV_VARS}")
          fi

          # github#709: Secret Manager references, merged with --update-secrets so a
          # secret that is not listed is never unmounted. References only, never values.
          SECRET_FLAGS=()
          if [ -n "${INPUT_SECRET_ENV:-}" ]; then
            secret_entries=()
            while IFS= read -r raw || [ -n "$raw" ]; do
              line="${raw#"${raw%%[![:space:]]*}"}"
              line="${line%"${line##*[![:space:]]}"}"
              [ -n "$line" ] || continue
              [[ "$line" == \#* ]] && continue
              name="${line%%=*}"
              ref="${line#*=}"
              if [ "$name" = "$line" ] || ! [[ "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                echo "::error::secret_env entry is not NAME=SECRET[:VERSION]: '${name}'"
                exit 1
              fi
              sm_ref="${ref%%:*}"
              version="latest"
              [ "$sm_ref" = "$ref" ] || version="${ref#*:}"
              if ! [[ "$sm_ref" =~ ^[A-Za-z0-9_-]+$ || "$sm_ref" =~ ^projects/[0-9]+/secrets/[A-Za-z0-9_-]+$ ]]; then
                echo "::error::secret_env ${name}: expected a secret id or projects/<number>/secrets/<id>"
                exit 1
              fi
              if ! [[ "$version" =~ ^(latest|[0-9]+)$ ]]; then
                echo "::error::secret_env ${name}: version must be latest or a number"
                exit 1
              fi
              secret_entries+=("${name}=${sm_ref}:${version}")
            done <<< "${INPUT_SECRET_ENV}"
            if [ "${#secret_entries[@]}" -gt 0 ]; then
              SECRET_FLAGS=("--update-secrets=$(IFS=,; printf '%s' "${secret_entries[*]}")")
            fi
          fi

          deploy_args=(
            "${INPUT_SERVICE_NAME}"
            "--image" "${IMAGE}"
            "--region" "${INPUT_REGION}"
            "--project" "${DEPLOY_PROJECT_ID}"
            "--platform" "managed"
            "--min-instances" "${INPUT_MIN_INSTANCES}"
            "--max-instances" "${INPUT_MAX_INSTANCES}"
            ${ENV_FLAGS[@]+"${ENV_FLAGS[@]}"}
            ${SECRET_FLAGS[@]+"${SECRET_FLAGS[@]}"}
            "--quiet"
          )

          if [ -n "${INPUT_RUNTIME_SERVICE_ACCOUNT}" ]; then
            if ! [[ "${INPUT_RUNTIME_SERVICE_ACCOUNT}" =~ ^[^[:space:]@]+@[^[:space:]@]+\.iam\.gserviceaccount\.com$ ]]; then
              echo "::error::runtime_service_account must be a service account email ending with .iam.gserviceaccount.com, got '${INPUT_RUNTIME_SERVICE_ACCOUNT}'"
              exit 1
            fi
            deploy_args+=("--service-account" "${INPUT_RUNTIME_SERVICE_ACCOUNT}")
          fi

          if [ -n "${INPUT_INGRESS}" ]; then
            case "${INPUT_INGRESS}" in
              all|internal|internal-and-cloud-load-balancing)
                ;;
              *)
                echo "::error::ingress must be one of: all, internal, internal-and-cloud-load-balancing. Got '${INPUT_INGRESS}'"
                exit 1
                ;;
            esac
            deploy_args+=("--ingress" "${INPUT_INGRESS}")
          fi

          if [ -n "${INPUT_MEMORY}" ]; then
            if ! [[ "${INPUT_MEMORY}" =~ ^[0-9]+(Mi|Gi)$ ]]; then
              echo "::error::memory must match pattern NNNMi or NNNGi, got '${INPUT_MEMORY}'"
              exit 1
            fi
            deploy_args+=("--memory" "${INPUT_MEMORY}")
          fi

          if [ -n "${INPUT_CPU}" ]; then
            if ! [[ "${INPUT_CPU}" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
              echo "::error::cpu must be a positive number (e.g. 1, 2, 0.5), got '${INPUT_CPU}'"
              exit 1
            fi
            deploy_args+=("--cpu" "${INPUT_CPU}")
          fi

          if ! [[ "${INPUT_TIMEOUT}" =~ ^[0-9]+$ ]]; then
            echo "::error::timeout must be a non-negative integer, got '${INPUT_TIMEOUT}'"
            exit 1
          fi
          if [ "${INPUT_TIMEOUT}" -gt 0 ]; then
            deploy_args+=("--timeout" "${INPUT_TIMEOUT}")
          fi

          if ! [[ "${INPUT_PORT}" =~ ^[0-9]+$ ]]; then
            echo "::error::port must be a non-negative integer, got '${INPUT_PORT}'"
            exit 1
          fi
          if [ "${INPUT_PORT}" -gt 0 ]; then
            deploy_args+=("--port" "${INPUT_PORT}")
          fi

          if [ "${INPUT_ALLOW_UNAUTHENTICATED}" = "true" ] && [ "${NORMALIZED_DEPLOY_ENVIRONMENT}" = "production" ]; then
            if [ "${INPUT_INGRESS}" != "internal-and-cloud-load-balancing" ]; then
              echo "::error::allow_unauthenticated=true is only permitted for production when ingress=internal-and-cloud-load-balancing."
              exit 1
            fi
          fi

          if [ -n "$STAGED_HEALTH_PATH" ]; then
            probe_port="${INPUT_PORT}"
            [ "$probe_port" -gt 0 ] || probe_port=8080
            deploy_args+=("--no-traffic" "--deploy-health-check" "--revision-suffix=${STAGE_SUFFIX}-base"
              "--startup-probe=httpGet.path=${STAGED_HEALTH_PATH},httpGet.port=${probe_port},initialDelaySeconds=0,failureThreshold=24,timeoutSeconds=5,periodSeconds=10")
          elif [ "${INPUT_ALLOW_UNAUTHENTICATED}" = "true" ]; then
            deploy_args+=("--allow-unauthenticated")
          else
            deploy_args+=("--no-allow-unauthenticated")
          fi

          gcloud run deploy "${deploy_args[@]}"
          # BEGIN stage-promote
          if [ -n "$STAGED_HEALTH_PATH" ]; then
            gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format=json > "$STAGE_DIR/current.json"
            gcloud run revisions describe "$STAGE_CANDIDATE" --region="$REGION" --project="$PROJECT_ID" --format=json > "$STAGE_DIR/revision.json"
            python3 "$STAGE_DIR/policy.py" --before "$STAGE_DIR/before.json" \
              --current "$STAGE_DIR/current.json" --revision "$STAGE_DIR/revision.json" \
              --expected-revision "$STAGE_CANDIDATE" --expected-image "$STAGED_IMAGE" \
              --health-path "$STAGED_HEALTH_PATH" --health-port "$probe_port" > "$STAGE_DIR/plan.json"
            # Preserve the exact rollback target in the run summary, never secret-bearing JSON.
            python3 - "$STAGE_DIR/plan.json" "$GITHUB_STEP_SUMMARY" <<'STAGE_SUMMARY_PY'
          import json, os, sys
          with open(sys.argv[1]) as stream:
              plan = json.load(stream)
          with open(sys.argv[2], 'a') as stream:
              stream.write('\nStaged candidate: `' + plan['revision'] + '`\n')
              stream.write('Rollback split: `' + plan['rollback_argument'] + '`\n')
              stream.write('Health scope: exact-revision HTTP startup; business smoke remains separate.\n')
          STAGE_SUMMARY_PY
            if [ -n "$DEBOUNCE_ENVIRONMENT" ]; then
              current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
              [ "$current" = "$GITHUB_SHA" ] || { echo 'Main advanced; leave candidate unserved.' >&2; exit 1; }
            fi
            gcloud run services update-traffic "$SERVICE" --region="$REGION" --project="$PROJECT_ID" \
              --to-revisions="${STAGE_CANDIDATE}=100"
            gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format=json > "$STAGE_DIR/after.json"
            python3 - "$STAGE_DIR" "$STAGE_CANDIDATE" <<'STAGE_VERIFY_PY'
          import json, os, sys
          from pathlib import Path
          directory = Path(sys.argv[1])
          sys.path.insert(0, str(directory))
          from policy import serving_state, require
          original = serving_state(json.loads((directory / 'before.json').read_text()))
          actual = serving_state(json.loads((directory / 'after.json').read_text()))
          require(actual['split'] == {sys.argv[2]: 100}, 'promotion traffic readback mismatch')
          original.pop('split'); actual.pop('split')
          require(original == actual, 'promotion changed tags, identity or ingress')
          STAGE_VERIFY_PY
          fi
          # END stage-promote


      - name: Get Service URL
        id: url
        env:
          INPUT_SERVICE_NAME: ${{ inputs.service_name }}
          INPUT_REGION: ${{ inputs.region }}
        run: |
          URL=$(gcloud run services describe "${INPUT_SERVICE_NAME}" \
            --region "${INPUT_REGION}" \
            --project "${DEPLOY_PROJECT_ID}" \
            --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🚀 Service deployed to: $URL"

      - name: Health Check
        run: |
          echo "Performing health check..."
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.url.outputs.url }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "Attempt $i: Status $STATUS, retrying..."
            sleep 10
          done
          echo "⚠️ Health check did not pass (may be expected for some services)"
