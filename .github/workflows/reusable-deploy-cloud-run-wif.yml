name: Deploy to Cloud Run (WIF)

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Cloud Run service name'
        required: true
        type: string
      region:
        description: 'GCP region'
        required: false
        type: string
        default: 'europe-west1'
      image_name:
        description: 'Container image name (without registry prefix)'
        required: true
        type: string
      deploy_project_id:
        description: 'Cloud Run deploy project ID (defaults to secret GCP_PROJECT_ID)'
        required: false
        type: string
        default: ''
      artifact_project_id:
        description: 'Artifact Registry project ID (defaults to deploy project)'
        required: false
        type: string
        default: ''
      artifact_location:
        description: 'Artifact Registry location (defaults to Cloud Run region)'
        required: false
        type: string
        default: ''
      artifact_repository:
        description: 'Artifact Registry repository name'
        required: false
        type: string
        default: 'containers'
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: 'Dockerfile'
      environment_name:
        description: 'GitHub Environment name for the deploy job'
        required: false
        type: string
        default: ''
      environment_url:
        description: 'Optional GitHub Environment URL for the deploy job'
        required: false
        type: string
        default: ''
      runtime_service_account:
        description: 'Optional runtime service account email for Cloud Run'
        required: false
        type: string
        default: ''
      wif_provider:
        description: 'Optional WIF provider when caller stores auth metadata in vars'
        required: false
        type: string
        default: ''
      wif_service_account:
        description: 'Optional WIF service account when caller stores auth metadata in vars'
        required: false
        type: string
        default: ''
      ingress:
        description: 'Cloud Run ingress setting'
        required: false
        type: string
        default: ''
      memory:
        description: 'Optional Cloud Run memory allocation override'
        required: false
        type: string
        default: ''
      cpu:
        description: 'Optional Cloud Run CPU allocation override'
        required: false
        type: string
        default: ''
      timeout:
        description: 'Optional Cloud Run request timeout override in seconds'
        required: false
        type: number
        default: 0
      port:
        description: 'Optional Cloud Run container port override'
        required: false
        type: number
        default: 0
      allow_unauthenticated:
        description: 'Allow unauthenticated access to the deployed service (true = public internet access). REQUIRED: callers must set this explicitly.'
        required: true
        type: boolean
      environment:
        description: 'Environment (staging/production)'
        required: false
        type: string
        default: 'staging'
      min_instances:
        description: 'Minimum instances'
        required: false
        type: number
        default: 0
      max_instances:
        description: 'Maximum instances'
        required: false
        type: number
        default: 10
      # --- gcloud (github#963, EPIC merglbot-core/platform#1722) ---
      # GitHub-hosted ubuntu runners preinstall the Google Cloud SDK, and
      # google-github-actions/auth writes the credentials it finds. Set false to
      # skip the 20-40 s setup-gcloud step when no specific gcloud version or
      # extra component is needed (this workflow only runs GA `gcloud auth`,
      # `gcloud run` and `gcloud artifacts` commands). Default true keeps today's behaviour.
      install_gcloud:
        description: 'Install gcloud via google-github-actions/setup-gcloud (false = use the runner-preinstalled SDK)'
        type: boolean
        default: true
        required: false
    secrets:
      WIF_PROVIDER:
        description: 'Workload Identity Federation provider'
        required: false
      WIF_SERVICE_ACCOUNT:
        description: 'Service account email for WIF'
        required: false
      GCP_PROJECT_ID:
        description: 'GCP Project ID'
        required: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Build, scan, and deploy usually <15m; buffer for registry latency
    environment:
      name: ${{ inputs.environment_name != '' && inputs.environment_name || inputs.environment }}
      url: ${{ inputs.environment_url != '' && inputs.environment_url || '' }}
    permissions:
      contents: read
      id-token: write  # Required for WIF OIDC token
      security-events: write  # Needed for SARIF upload

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve WIF parameters
        id: wif
        shell: bash
        env:
          INPUT_WIF_PROVIDER: ${{ inputs.wif_provider }}
          INPUT_WIF_SERVICE_ACCOUNT: ${{ inputs.wif_service_account }}
          SECRET_WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
          SECRET_WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail

          # Canonical provider is intentionally pinned to the platform SSOT.
          SSOT_WIF_PROVIDER="projects/671585034644/locations/global/workloadIdentityPools/github-actions/providers/github-oidc"

          echo "::add-mask::$INPUT_WIF_PROVIDER"
          echo "::add-mask::$INPUT_WIF_SERVICE_ACCOUNT"
          echo "::add-mask::$SECRET_WIF_PROVIDER"
          echo "::add-mask::$SECRET_WIF_SERVICE_ACCOUNT"

          WIF_PROVIDER="${INPUT_WIF_PROVIDER:-$SECRET_WIF_PROVIDER}"
          WIF_SERVICE_ACCOUNT="${INPUT_WIF_SERVICE_ACCOUNT:-$SECRET_WIF_SERVICE_ACCOUNT}"

          if [ -z "$WIF_PROVIDER" ]; then
            echo "::error::wif_provider is empty and secret WIF_PROVIDER is not set"
            exit 1
          fi

          if [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "::error::wif_service_account is empty and secret WIF_SERVICE_ACCOUNT is not set"
            exit 1
          fi

          if [ "$WIF_PROVIDER" != "$SSOT_WIF_PROVIDER" ]; then
            echo "::error::wif_provider must point to the SSOT provider in merglbot-seed (${SSOT_WIF_PROVIDER})."
            exit 1
          fi

          if [[ "$WIF_SERVICE_ACCOUNT" == *@merglbot.iam.gserviceaccount.com ]]; then
            echo "::error::wif_service_account points to a legacy service account in the DELETE_REQUESTED 'merglbot' project."
            exit 1
          fi

          echo "::add-mask::$WIF_PROVIDER"
          echo "::add-mask::$WIF_SERVICE_ACCOUNT"

          {
            printf 'wif_provider=%s\n' "$WIF_PROVIDER"
            printf 'wif_service_account=%s\n' "$WIF_SERVICE_ACCOUNT"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP (WIF)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ steps.wif.outputs.wif_provider }}
          service_account: ${{ steps.wif.outputs.wif_service_account }}
          token_format: 'access_token'

      - name: Resolve deployment parameters
        id: deploy-params
        shell: bash
        env:
          INPUT_DEPLOY_PROJECT_ID: ${{ inputs.deploy_project_id }}
          INPUT_ARTIFACT_PROJECT_ID: ${{ inputs.artifact_project_id }}
          INPUT_ARTIFACT_LOCATION: ${{ inputs.artifact_location }}
          INPUT_ARTIFACT_REPOSITORY: ${{ inputs.artifact_repository }}
          INPUT_REGION: ${{ inputs.region }}
          SECRET_GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail

          DEPLOY_PROJECT_ID="${INPUT_DEPLOY_PROJECT_ID:-$SECRET_GCP_PROJECT_ID}"
          ARTIFACT_PROJECT_ID="${INPUT_ARTIFACT_PROJECT_ID:-$DEPLOY_PROJECT_ID}"
          ARTIFACT_LOCATION="${INPUT_ARTIFACT_LOCATION:-$INPUT_REGION}"
          ARTIFACT_REPOSITORY="${INPUT_ARTIFACT_REPOSITORY}"

          if [ -z "$DEPLOY_PROJECT_ID" ]; then
            echo "::error::deploy_project_id is empty and secret GCP_PROJECT_ID is not set"
            exit 1
          fi

          if [ -z "$ARTIFACT_PROJECT_ID" ]; then
            echo "::error::artifact_project_id could not be resolved"
            exit 1
          fi

          if [ -z "$ARTIFACT_LOCATION" ]; then
            echo "::error::artifact_location could not be resolved"
            exit 1
          fi

          if [ -z "$ARTIFACT_REPOSITORY" ]; then
            echo "::error::artifact_repository could not be resolved"
            exit 1
          fi

          {
            printf 'DEPLOY_PROJECT_ID=%s\n' "$DEPLOY_PROJECT_ID"
            printf 'ARTIFACT_PROJECT_ID=%s\n' "$ARTIFACT_PROJECT_ID"
            printf 'ARTIFACT_LOCATION=%s\n' "$ARTIFACT_LOCATION"
            printf 'ARTIFACT_REPOSITORY=%s\n' "$ARTIFACT_REPOSITORY"
          } >> "$GITHUB_ENV"

      - name: Setup gcloud CLI
        if: ${{ inputs.install_gcloud }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1
        with:
          project_id: ${{ env.DEPLOY_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${ARTIFACT_LOCATION}-docker.pkg.dev" --quiet

      - name: Build Container Image
        id: build
        env:
          INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
          INPUT_IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE_BASE="${ARTIFACT_LOCATION}-docker.pkg.dev/${ARTIFACT_PROJECT_ID}/${ARTIFACT_REPOSITORY}/${INPUT_IMAGE_NAME}"
          build_image() { docker build -t "$1" -f "$INPUT_DOCKERFILE" .; }
          # BEGIN image-publish
          # Idempotent (github#909): the tag is the commit SHA, so an existing tag is
          # adopted, never rebuilt or re-pushed (immutable repos reject a re-push).
          ref="${IMAGE_BASE}:${IMAGE_TAG}"
          IMAGE_DIGEST=""
          probe_rc=0
          probe_out="$(docker pull --quiet "$ref" 2>&1)" || probe_rc=$?
          if [ "$probe_rc" -eq 0 ]; then
            IMAGE_ADOPTED=true
            echo "::notice::Image tag ${ref} already exists; adopting it (no rebuild, no push)."
          elif [[ $probe_out =~ (denied|unauthorized|forbidden|toomanyrequests) ]]; then
            printf '%s\n' "$probe_out" >&2
            echo "::error::Probing ${ref} was refused; not guessing whether the tag exists."
            exit 1
          elif [[ $probe_out =~ (manifest\ unknown|MANIFEST_UNKNOWN|manifest\ for\ [^[:space:]]+\ not\ found|failed\ to\ resolve\ reference\ .*:\ not\ found) ]]; then
            IMAGE_ADOPTED=false
            build_image "$ref"
            push_rc=0
            push_out="$(docker push "$ref" 2>&1)" || push_rc=$?
            printf '%s\n' "$push_out"
            if [ "$push_rc" -ne 0 ]; then
              echo "::error::docker push ${ref} failed (exit ${push_rc})."
              exit 1
            fi
            if [[ $push_out =~ digest:\ (sha256:[0-9a-f]{64}) ]]; then IMAGE_DIGEST="${BASH_REMATCH[1]}"; fi
          else
            printf '%s\n' "$probe_out" >&2
            echo "::error::Unexpected result probing ${ref} (exit ${probe_rc}); not guessing whether the tag exists."
            exit 1
          fi
          # Both paths: fall back to the local RepoDigests of this exact repository.
          attempt=0
          while [ -z "$IMAGE_DIGEST" ] && [ "$attempt" -lt 5 ]; do
            attempt=$((attempt + 1))
            repo_digests="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$ref")" || repo_digests=""
            while IFS= read -r line; do
              if [[ $line == "${IMAGE_BASE}@"* ]]; then
                IMAGE_DIGEST="${line#"${IMAGE_BASE}@"}"
                break
              fi
            done <<< "$repo_digests"
            if [ -z "$IMAGE_DIGEST" ]; then sleep 2; fi
          done
          if ! [[ $IMAGE_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to resolve a sha256 digest for ${ref} (got '${IMAGE_DIGEST}')."
            exit 1
          fi
          IMAGE_REF="${IMAGE_BASE}@${IMAGE_DIGEST}"
          # END image-publish

          # Scan + deploy by immutable digest instead of the mutable :<sha> tag
          # (tag can be re-pushed in the registry; the digest cannot).
          echo "IMAGE=${IMAGE_REF}" >> "$GITHUB_ENV"
          echo "adopted=${IMAGE_ADOPTED}" >> "$GITHUB_OUTPUT"
          echo "✅ Image ready: ${IMAGE_REF} (tag: ${IMAGE_TAG}, adopted: ${IMAGE_ADOPTED})"

      # Container Security: Trivy scan
      # - SARIF is non-blocking (Code Scanning visibility)
      # - Separate gate blocks deploy on CRITICAL (no gating softening)
      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.34.1
        continue-on-error: true
        with:
          version: 'v0.69.3'
          image-ref: ${{ env.IMAGE }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          limit-severities-for-sarif: true
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy vulnerability scanner (gate)
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.34.1
        with:
          version: 'v0.69.3'
          image-ref: ${{ env.IMAGE }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

      - name: Deploy to Cloud Run
        env:
          INPUT_SERVICE_NAME: ${{ inputs.service_name }}
          INPUT_REGION: ${{ inputs.region }}
          INPUT_ENVIRONMENT: ${{ inputs.environment_name != '' && inputs.environment_name || inputs.environment }}
          INPUT_MIN_INSTANCES: ${{ inputs.min_instances }}
          INPUT_MAX_INSTANCES: ${{ inputs.max_instances }}
          INPUT_TIMEOUT: ${{ inputs.timeout }}
          INPUT_PORT: ${{ inputs.port }}
          INPUT_RUNTIME_SERVICE_ACCOUNT: ${{ inputs.runtime_service_account }}
          INPUT_INGRESS: ${{ inputs.ingress }}
          INPUT_MEMORY: ${{ inputs.memory }}
          INPUT_CPU: ${{ inputs.cpu }}
          INPUT_ALLOW_UNAUTHENTICATED: ${{ inputs.allow_unauthenticated }}
        run: |
          set -euo pipefail

          NORMALIZED_DEPLOY_ENVIRONMENT="$(printf '%s' "${INPUT_ENVIRONMENT}" | tr '[:upper:]' '[:lower:]')"

          deploy_args=(
            "${INPUT_SERVICE_NAME}"
            "--image" "${IMAGE}"
            "--region" "${INPUT_REGION}"
            "--project" "${DEPLOY_PROJECT_ID}"
            "--platform" "managed"
            "--min-instances" "${INPUT_MIN_INSTANCES}"
            "--max-instances" "${INPUT_MAX_INSTANCES}"
            "--set-env-vars=ENVIRONMENT=${INPUT_ENVIRONMENT}"
            "--quiet"
          )

          if [ -n "${INPUT_RUNTIME_SERVICE_ACCOUNT}" ]; then
            if ! [[ "${INPUT_RUNTIME_SERVICE_ACCOUNT}" =~ ^[^[:space:]@]+@[^[:space:]@]+\.iam\.gserviceaccount\.com$ ]]; then
              echo "::error::runtime_service_account must be a service account email ending with .iam.gserviceaccount.com, got '${INPUT_RUNTIME_SERVICE_ACCOUNT}'"
              exit 1
            fi
            deploy_args+=("--service-account" "${INPUT_RUNTIME_SERVICE_ACCOUNT}")
          fi

          if [ -n "${INPUT_INGRESS}" ]; then
            case "${INPUT_INGRESS}" in
              all|internal|internal-and-cloud-load-balancing)
                ;;
              *)
                echo "::error::ingress must be one of: all, internal, internal-and-cloud-load-balancing. Got '${INPUT_INGRESS}'"
                exit 1
                ;;
            esac
            deploy_args+=("--ingress" "${INPUT_INGRESS}")
          fi

          if [ -n "${INPUT_MEMORY}" ]; then
            if ! [[ "${INPUT_MEMORY}" =~ ^[0-9]+(Mi|Gi)$ ]]; then
              echo "::error::memory must match pattern NNNMi or NNNGi, got '${INPUT_MEMORY}'"
              exit 1
            fi
            deploy_args+=("--memory" "${INPUT_MEMORY}")
          fi

          if [ -n "${INPUT_CPU}" ]; then
            if ! [[ "${INPUT_CPU}" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
              echo "::error::cpu must be a positive number (e.g. 1, 2, 0.5), got '${INPUT_CPU}'"
              exit 1
            fi
            deploy_args+=("--cpu" "${INPUT_CPU}")
          fi

          if ! [[ "${INPUT_TIMEOUT}" =~ ^[0-9]+$ ]]; then
            echo "::error::timeout must be a non-negative integer, got '${INPUT_TIMEOUT}'"
            exit 1
          fi
          if [ "${INPUT_TIMEOUT}" -gt 0 ]; then
            deploy_args+=("--timeout" "${INPUT_TIMEOUT}")
          fi

          if ! [[ "${INPUT_PORT}" =~ ^[0-9]+$ ]]; then
            echo "::error::port must be a non-negative integer, got '${INPUT_PORT}'"
            exit 1
          fi
          if [ "${INPUT_PORT}" -gt 0 ]; then
            deploy_args+=("--port" "${INPUT_PORT}")
          fi

          if [ "${INPUT_ALLOW_UNAUTHENTICATED}" = "true" ] && [ "${NORMALIZED_DEPLOY_ENVIRONMENT}" = "production" ]; then
            if [ "${INPUT_INGRESS}" != "internal-and-cloud-load-balancing" ]; then
              echo "::error::allow_unauthenticated=true is only permitted for production when ingress=internal-and-cloud-load-balancing."
              exit 1
            fi
          fi

          if [ "${INPUT_ALLOW_UNAUTHENTICATED}" = "true" ]; then
            deploy_args+=("--allow-unauthenticated")
          else
            deploy_args+=("--no-allow-unauthenticated")
          fi

          gcloud run deploy "${deploy_args[@]}"

      - name: Get Service URL
        id: url
        env:
          INPUT_SERVICE_NAME: ${{ inputs.service_name }}
          INPUT_REGION: ${{ inputs.region }}
        run: |
          URL=$(gcloud run services describe "${INPUT_SERVICE_NAME}" \
            --region "${INPUT_REGION}" \
            --project "${DEPLOY_PROJECT_ID}" \
            --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "🚀 Service deployed to: $URL"

      - name: Health Check
        run: |
          echo "Performing health check..."
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.url.outputs.url }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "Attempt $i: Status $STATUS, retrying..."
            sleep 10
          done
          echo "⚠️ Health check did not pass (may be expected for some services)"
