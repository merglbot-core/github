name: Reusable - Deploy to Cloud Run

on:
  workflow_call:
    inputs:
      service:
        description: 'Cloud Run service name'
        required: true
        type: string
      region:
        description: 'GCP region'
        required: false
        type: string
        default: 'europe-west1'
      project_id:
        description: 'GCP Project ID'
        required: true
        type: string
      artifact_project_id:
        description: 'Optional Artifact Registry project override for image push'
        required: false
        type: string
        default: ''
      artifact_repository:
        description: 'Artifact Registry repository name'
        required: false
        type: string
        default: 'docker'
      service_account:
        description: 'Email of the Cloud Run service account'
        required: true
        type: string
      environment:
        description: 'Target environment (e.g., production, staging)'
        required: false
        type: string
        default: 'production'
      dockerfile:
        description: 'Path to the Dockerfile'
        required: false
        type: string
        default: 'Dockerfile'
      env_vars:
        description: 'Comma-separated list of ENV_VAR=value'
        required: false
        type: string
      secrets:
        description: 'Newline-separated SECRET_NAME=secret-id:version'
        required: false
        type: string
      allow_unauthenticated:
        description: 'Allow unauthenticated access (use only for services behind IAP/Load Balancer with own auth)'
        required: false
        type: boolean
        default: false
      # --- gcloud (github#963, EPIC merglbot-core/platform#1722) ---
      # GitHub-hosted ubuntu runners preinstall the Google Cloud SDK, and
      # google-github-actions/auth writes the credentials it finds. Set false to
      # skip the 20-40 s setup-gcloud step when no specific gcloud version or
      # extra component is needed (this workflow only runs GA `gcloud auth`,
      # `gcloud run` and `gcloud artifacts` commands). Default true keeps today's behaviour.
      install_gcloud:
        description: 'Install gcloud via google-github-actions/setup-gcloud (false = use the runner-preinstalled SDK)'
        type: boolean
        default: true
        required: false
    secrets:
      GCP_WIF_PROVIDER:
        required: true
      GCP_WIF_SERVICE_ACCOUNT:
        required: true
      GAR_LOCATION:
        required: true

concurrency:
  group: deploy-${{ inputs.service }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SERVICE: ${{ inputs.service }}
  REGION: ${{ inputs.region }}
  PROJECT_ID: ${{ inputs.project_id }}
  IMAGE_PROJECT_ID: ${{ inputs.artifact_project_id || inputs.project_id }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
  ARTIFACT_REPO: ${{ inputs.artifact_repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    permissions:
      contents: read           # standard deploy callers only need repository read access
      id-token: write          # needed for WIF to GCP
      security-events: write   # needed for SARIF upload
      actions: read            # needed for SARIF upload telemetry (avoids "Resource not accessible by integration")
      packages: read           # enables caller Docker builds to resolve private GitHub Packages via github.token

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate WIF provider (SSOT)
        shell: bash
        run: |
          set -euo pipefail

          SSOT_WIF_PROVIDER="projects/671585034644/locations/global/workloadIdentityPools/github-actions/providers/github-oidc"

          if [ "${{ secrets.GCP_WIF_PROVIDER }}" != "${SSOT_WIF_PROVIDER}" ]; then
            echo "::error::GCP_WIF_PROVIDER must point to the SSOT provider in merglbot-seed (${SSOT_WIF_PROVIDER})."
            echo "::error::Fix by updating the caller repo/org variable passed into this reusable workflow."
            exit 1
          fi

          if [[ "${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}" == *@merglbot.iam.gserviceaccount.com ]]; then
            echo "::error::GCP_WIF_SERVICE_ACCOUNT points to a legacy service account in the DELETE_REQUESTED 'merglbot' project."
            echo "::error::Create a dedicated deploy SA in an active target project and update the repo variable."
            exit 1
          fi
     
      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
      
      - name: Set up Cloud SDK
        if: ${{ inputs.install_gcloud }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3
      
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev
      
      # Before the build: `adoptable` verifies an existing tag's signature (github#909).
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Build and Push Docker image
        id: build
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          IMAGE_BASE: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.IMAGE_PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE }}
          IMAGE_TAG: ${{ github.sha }}
          INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          set -euo pipefail
          build_image() {
            docker build \
              --secret id=node_auth_token,env=NODE_AUTH_TOKEN \
              -t "$1" \
              -f "$INPUT_DOCKERFILE" .
          }
          # Provenance (github#909): an existing tag is adopted only when its digest carries
          # a signature this hub workflow made for this caller repository in a run of this
          # very commit (the tag is github.sha, the certificate records the run's commit),
          # so neither another repo nor an older signed digest of this repo can be adopted
          # under this tag; any other tag is rebuilt and pushed.
          adoptable() {
            cosign verify \
              --certificate-identity-regexp '^https://github\.com/merglbot-core/github/\.github/workflows/reusable-deploy-cloud-run\.yml@' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              --certificate-github-workflow-sha "$IMAGE_TAG" \
              "$1" >/dev/null 2>&1
          }
          # BEGIN image-publish
          # Idempotent (github#909): the tag is the commit SHA, so an existing tag whose
          # digest passes `adoptable` (defined per workflow above) is adopted, never rebuilt
          # or re-pushed (immutable repos reject a re-push). The registry repository can be
          # shared with other repos' deploy identities, so a tag without that evidence is
          # rebuilt from this commit and pushed like an absent one: an immutable repository
          # refuses that push, a mutable one takes this build. Only the verified digest is used.
          ref="${IMAGE_BASE}:${IMAGE_TAG}"
          IMAGE_DIGEST=""
          pulled_digest() {  # digest of the locally pulled ${ref} in this repository, or empty
            local line digests
            digests="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$ref")" || return 0
            while IFS= read -r line; do
              if [[ $line == "${IMAGE_BASE}@sha256:"* ]]; then printf '%s\n' "${line#"${IMAGE_BASE}@"}"; return 0; fi
            done <<< "$digests"
          }
          probe_rc=0
          probe_out="$(docker pull --quiet "$ref" 2>&1)" || probe_rc=$?
          existing=""
          if [ "$probe_rc" -eq 0 ]; then
            existing="$(pulled_digest)"
            if [ -z "$existing" ]; then
              echo "::error::Pulled ${ref} but could not resolve its digest in this repository; not guessing."
              exit 1
            fi
          fi
          if [ -n "$existing" ] && adoptable "${IMAGE_BASE}@${existing}"; then
            IMAGE_ADOPTED=true
            IMAGE_DIGEST="$existing"
            echo "::notice::Image tag ${ref} already exists with verified provenance; adopting ${existing} (no rebuild, no push)."
          elif [ "$probe_rc" -ne 0 ] && [[ $probe_out =~ (denied|unauthorized|forbidden|toomanyrequests) ]]; then
            printf '%s\n' "$probe_out" >&2
            echo "::error::Probing ${ref} was refused; not guessing whether the tag exists."
            exit 1
          elif [ "$probe_rc" -eq 0 ] || [[ $probe_out =~ (manifest\ unknown|MANIFEST_UNKNOWN|manifest\ for\ [^[:space:]]+\ not\ found|failed\ to\ resolve\ reference\ .*:\ not\ found) ]]; then
            if [ "$probe_rc" -eq 0 ]; then
              echo "::notice::Image tag ${ref} exists without verified provenance; rebuilding it from this commit and pushing."
            fi
            IMAGE_ADOPTED=false
            build_image "$ref"
            push_rc=0
            push_out="$(docker push "$ref" 2>&1)" || push_rc=$?
            printf '%s\n' "$push_out"
            if [ "$push_rc" -ne 0 ]; then
              # A concurrent deploy of the same commit may have published the tag between the
              # probe and this push (an immutable repository then refuses the push): probe the
              # exact tag once more and adopt it only when it exists now with verified
              # provenance; anything else fails.
              reprobe_rc=0
              reprobe_out="$(docker pull --quiet "$ref" 2>&1)" || reprobe_rc=$?
              if [ "$reprobe_rc" -ne 0 ]; then
                printf '%s\n' "$reprobe_out" >&2
                echo "::error::docker push ${ref} failed (exit ${push_rc}) and the tag does not exist."
                exit 1
              fi
              existing="$(pulled_digest)"
              if [ -z "$existing" ] || ! adoptable "${IMAGE_BASE}@${existing}"; then
                echo "::error::docker push ${ref} failed (exit ${push_rc}); the tag exists without verified provenance, so it is not adopted."
                exit 1
              fi
              IMAGE_ADOPTED=true
              IMAGE_DIGEST="$existing"
              echo "::notice::docker push ${ref} failed, but the tag exists now with verified provenance (concurrent publication); adopting ${existing}."
            elif [[ $push_out =~ digest:\ (sha256:[0-9a-f]{64}) ]]; then
              IMAGE_DIGEST="${BASH_REMATCH[1]}"
            fi
          else
            printf '%s\n' "$probe_out" >&2
            echo "::error::Unexpected result probing ${ref} (exit ${probe_rc}); not guessing whether the tag exists."
            exit 1
          fi
          # Both paths: fall back to the local RepoDigests of this exact repository.
          attempt=0
          while [ -z "$IMAGE_DIGEST" ] && [ "$attempt" -lt 5 ]; do
            attempt=$((attempt + 1))
            repo_digests="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$ref")" || repo_digests=""
            while IFS= read -r line; do
              if [[ $line == "${IMAGE_BASE}@"* ]]; then
                IMAGE_DIGEST="${line#"${IMAGE_BASE}@"}"
                break
              fi
            done <<< "$repo_digests"
            if [ -z "$IMAGE_DIGEST" ]; then sleep 2; fi
          done
          if ! [[ $IMAGE_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to resolve a sha256 digest for ${ref} (got '${IMAGE_DIGEST}')."
            exit 1
          fi
          IMAGE_REF="${IMAGE_BASE}@${IMAGE_DIGEST}"
          # END image-publish

          {
            echo "image=${IMAGE_BASE}"
            echo "tag=${IMAGE_TAG}"
            echo "digest=${IMAGE_DIGEST}"
            echo "full_image=${IMAGE_REF}"
            echo "adopted=${IMAGE_ADOPTED}"
          } >> "$GITHUB_OUTPUT"
          echo "✅ Image ready: ${IMAGE_REF} (adopted: ${IMAGE_ADOPTED})"

      # Container Security: Trivy Scanning
      # - SARIF is non-blocking (Code Scanning visibility)
      # - Separate gate blocks deploy on CRITICAL (no gating softening)
      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.34.1
        continue-on-error: true
        with:
          version: 'v0.69.3'
          image-ref: ${{ steps.build.outputs.full_image }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          limit-severities-for-sarif: true
          exit-code: '0'
          ignore-unfixed: true
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        continue-on-error: true  # Don't fail if SARIF upload has permission issues
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy vulnerability scanner (gate)
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.34.1
        with:
          version: 'v0.69.3'
          image-ref: ${{ steps.build.outputs.full_image }}
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
      
      # Container Security: SBOM Generation
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: ${{ steps.build.outputs.full_image }}
          format: 'cyclonedx-json'
          output-file: 'sbom.json'
      
      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: 'sbom-${{ github.sha }}'
          path: 'sbom.json'
          retention-days: 365
      
      # Container Security: Cosign Signing (Keyless with OIDC)
      - name: Sign container image
        env:
          IMAGE_REF: ${{ steps.build.outputs.full_image }}
          IMAGE_ADOPTED: ${{ steps.build.outputs.adopted }}
        run: |
          set -euo pipefail
          # BEGIN cosign-sign
          # Keyless signing with GitHub OIDC; the Fulcio identity is this hub workflow
          # file. An adopted image (github#909) may already be signed and re-signing can
          # fail on an immutable repository, so verify it with that identity first:
          # verified = keep, "no signatures found" = sign, anything else = fail.
          # Measured 1 Oct 2026 on a real signature (project-management-app run 36731604131):
          # the certificate SAN is this file at the pinned hub ref, the workflow-repository
          # extension (1.3.6.1.4.1.57264.1.5) is the caller repository = GITHUB_REPOSITORY.
          if [ "$IMAGE_ADOPTED" = "true" ]; then
            verify_rc=0
            verify_out="$(cosign verify \
              --certificate-identity-regexp '^https://github\.com/merglbot-core/github/\.github/workflows/reusable-deploy-cloud-run\.yml@' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --certificate-github-workflow-repository "$GITHUB_REPOSITORY" \
              "$IMAGE_REF" 2>&1)" || verify_rc=$?
            if [ "$verify_rc" -eq 0 ]; then
              echo "::notice::Adopted ${IMAGE_REF} already carries a verified signature; not re-signing."
              exit 0
            fi
            if [[ $verify_out =~ (no\ matching\ signatures|denied|unauthorized|DENIED|UNAUTHORIZED) ]] \
              || ! [[ $verify_out =~ no\ signatures\ found ]]; then
              printf '%s\n' "$verify_out" >&2
              echo "::error::cosign verify of adopted ${IMAGE_REF} failed (exit ${verify_rc}); not signing blindly."
              exit 1
            fi
            echo "Adopted ${IMAGE_REF} has no signature yet; signing it."
          fi
          cosign sign --yes "$IMAGE_REF"
          # END cosign-sign
      
      - name: Deploy to Cloud Run
        id: deploy
        env:
          SECRETS_INPUT: ${{ inputs.secrets }}
        run: |
          set -euo pipefail

          DEPLOYMENT_MODE="no-secrets"
          CROSS_PROJECT_ALIAS_SUMMARY="none"
          CROSS_PROJECT_ALIAS_COUNT=0
          SAME_PROJECT_SECRET_LINES=()
          CROSS_PROJECT_SECRET_LINES=()

          trim() {
            printf '%s' "$1" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          cleanup_temp_files() {
            rm -f /tmp/service.yaml /tmp/inject_xproj_secret.py /tmp/service.json 2>/dev/null || true
          }

          write_xproj_patcher() {
            printf '%s\n' 'import yaml, sys' > /tmp/inject_xproj_secret.py
            printf '%s\n' 'env_var, secret_resource, secret_version = sys.argv[1:4]' >> /tmp/inject_xproj_secret.py
            printf '%s\n' 'with open("/tmp/service.yaml") as f: svc = yaml.safe_load(f)' >> /tmp/inject_xproj_secret.py
            printf '%s\n' 'tmpl_meta = svc.setdefault("spec", {}).setdefault("template", {}).setdefault("metadata", {})' >> /tmp/inject_xproj_secret.py
            printf '%s\n' 'ann = tmpl_meta.setdefault("annotations", {})' >> /tmp/inject_xproj_secret.py
            printf '%s\n' 'k = "run.googleapis.com/secrets"' >> /tmp/inject_xproj_secret.py
            printf '%s\n' 'raw = str(ann.get(k, "") or "")' >> /tmp/inject_xproj_secret.py
            printf '%s\n' 'mp = {}' >> /tmp/inject_xproj_secret.py
            printf '%s\n' 'for ln in raw.replace("\n", ",").split(","):' >> /tmp/inject_xproj_secret.py
            printf '%s\n' '    ln = ln.strip()' >> /tmp/inject_xproj_secret.py
            printf '%s\n' '    if not ln or ":" not in ln: continue' >> /tmp/inject_xproj_secret.py
            printf '%s\n' '    a, b = ln.split(":", 1)' >> /tmp/inject_xproj_secret.py
            printf '%s\n' '    mp[a.strip()] = b.strip()' >> /tmp/inject_xproj_secret.py
            printf '%s\n' 'mp[env_var] = secret_resource' >> /tmp/inject_xproj_secret.py
            printf '%s\n' 'ann[k] = ",".join([f"{a}:{b}" for a,b in mp.items()])' >> /tmp/inject_xproj_secret.py
            printf '%s\n' 'containers = svc["spec"]["template"]["spec"]["containers"]' >> /tmp/inject_xproj_secret.py
            printf '%s\n' 'env_list = containers[0].get("env", [])' >> /tmp/inject_xproj_secret.py
            printf '%s\n' 'env_list = [e for e in env_list if e.get("name") != env_var]' >> /tmp/inject_xproj_secret.py
            printf '%s\n' 'env_list.append({"name": env_var, "valueFrom": {"secretKeyRef": {"name": env_var, "key": secret_version}}})' >> /tmp/inject_xproj_secret.py
            printf '%s\n' 'containers[0]["env"] = env_list' >> /tmp/inject_xproj_secret.py
            printf '%s\n' 'with open("/tmp/service.yaml", "w") as f: yaml.safe_dump(svc, f, sort_keys=False)' >> /tmp/inject_xproj_secret.py
          }

          verify_xproj_service() {
            local service_json="$1"
            shift

            python3 - "$service_json" "$@" <<'PY'
          import json
          import sys

          service_path = sys.argv[1]
          entries = sys.argv[2:]

          with open(service_path, encoding="utf-8") as f:
              svc = json.load(f)

          ann = (
              svc.get("spec", {})
                 .get("template", {})
                 .get("metadata", {})
                 .get("annotations", {})
          )
          raw = str(ann.get("run.googleapis.com/secrets", "") or "")
          mapping = {}
          for line in raw.replace("\n", ",").split(","):
              line = line.strip()
              if not line or ":" not in line:
                  continue
              alias, secret_ref = line.split(":", 1)
              mapping[alias.strip()] = secret_ref.strip()

          containers = (
              svc.get("spec", {})
                 .get("template", {})
                 .get("spec", {})
                 .get("containers", [])
          )
          env_index = {}
          if containers:
              for entry in containers[0].get("env", []):
                  name = entry.get("name")
                  if isinstance(name, str) and name:
                      env_index[name] = entry

          errors = []
          for item in entries:
              env_name, rest = item.split("=", 1)
              if ":" in rest:
                  secret_resource, secret_version = rest.rsplit(":", 1)
              else:
                  secret_resource, secret_version = rest, "latest"

              if mapping.get(env_name) != secret_resource:
                  errors.append(
                      f"annotation mismatch for {env_name}: alias mapping is missing or points to an unexpected resource"
                  )

              env_entry = env_index.get(env_name)
              if env_entry is None:
                  errors.append(f"missing env entry for {env_name}")
                  continue

              secret_ref = (
                  env_entry.get("valueFrom", {})
                           .get("secretKeyRef", {})
              )
              if secret_ref.get("name") != env_name:
                  errors.append(
                      f"secretKeyRef.name mismatch for {env_name}: expected alias {env_name}, got {secret_ref.get('name')!r}"
                  )
              if str(secret_ref.get("key") or "latest") != secret_version:
                  errors.append(
                      f"secretKeyRef.key mismatch for {env_name}: expected {secret_version}, got {secret_ref.get('key')!r}"
                  )

          if errors:
              for error in errors:
                  print(error, file=sys.stderr)
              raise SystemExit(1)
          PY
          }

          trap cleanup_temp_files EXIT

          # Construct gcloud command
          gcloud_cmd=(gcloud run deploy "$SERVICE"
            "--image=${{ steps.build.outputs.full_image }}"
            "--region=$REGION"
            "--project=$PROJECT_ID"
            "--service-account=${{ inputs.service_account }}"
            "--max-instances=10"
            "--min-instances=0"
            "--memory=1Gi"
            "--cpu=1"
            "--port=8080"
          )

          # Authentication flag (default: no-allow-unauthenticated for security)
          if [ "${{ inputs.allow_unauthenticated }}" = "true" ]; then
            gcloud_cmd+=("--allow-unauthenticated")
          else
            gcloud_cmd+=("--no-allow-unauthenticated")
          fi

          if [ -n "$SECRETS_INPUT" ]; then
            # Split secrets into same-project vs cross-project
            # Read newline-separated secrets input into an array (safe from injection)
            mapfile -t secret_lines < <(printf '%s\n' "$SECRETS_INPUT")

            for raw_line in "${secret_lines[@]}"; do
              line="$(trim "$raw_line")"
              [ -z "$line" ] && continue
              [[ "$line" == \#* ]] && continue

              if [[ "$line" != *"="* ]]; then
                echo "::error::Invalid secrets input line (missing '='): $line"
                exit 1
              fi

              env_name="${line%%=*}"
              value="${line#*=}"

              # Validate env var name (alphanumeric + underscore, start with letter or _)
              if ! [[ "$env_name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
                echo "::error::Invalid env var name in secrets input: $env_name"
                exit 1
              fi

              if [ -z "$value" ]; then
                echo "::error::Empty secret reference for $env_name"
                exit 1
              fi

              secret_ref="${value%%:*}"
              secret_version="${value#*:}"
              if [ -z "$secret_version" ] || [ "$secret_version" = "$value" ]; then
                secret_version="latest"
              fi

              entry="${env_name}=${secret_ref}:${secret_version}"
              if [[ "$secret_ref" == projects/* ]]; then
                if ! [[ "$secret_ref" =~ ^projects/[0-9]+/secrets/[A-Za-z0-9_-]+$ ]]; then
                  echo "::error::Invalid cross-project secret reference for $env_name: $secret_ref (expected projects/<project-number>/secrets/<secret-id>)"
                  exit 1
                fi
                echo "::add-mask::$secret_ref"
                CROSS_PROJECT_SECRET_LINES+=("$entry")
              else
                SAME_PROJECT_SECRET_LINES+=("$entry")
              fi
            done
          fi

          if [ "${#CROSS_PROJECT_SECRET_LINES[@]}" -gt 0 ]; then
            DEPLOYMENT_MODE="cross-project-reconcile"
            if [ -n "${{ inputs.env_vars }}" ]; then
              gcloud_cmd+=("--update-env-vars=${{ inputs.env_vars }}")
            fi
            if [ "${#SAME_PROJECT_SECRET_LINES[@]}" -gt 0 ]; then
              { IFS=,; SECRET_LIST="${SAME_PROJECT_SECRET_LINES[*]}"; }
              gcloud_cmd+=("--update-secrets=${SECRET_LIST}")
            fi
            CROSS_PROJECT_ALIAS_COUNT="${#CROSS_PROJECT_SECRET_LINES[@]}"
            CROSS_PROJECT_ALIAS_NAMES=()
            for line in "${CROSS_PROJECT_SECRET_LINES[@]}"; do
              CROSS_PROJECT_ALIAS_NAMES+=("${line%%=*}")
            done
            { IFS=,; CROSS_PROJECT_ALIAS_SUMMARY="${CROSS_PROJECT_ALIAS_NAMES[*]}"; }
            echo "::notice::Cross-project reconcile mode enabled for $SERVICE"
            echo "::notice::Base rollout runs before YAML patch to avoid replaying stale service specs"
            echo "::notice::Cross-project aliases: $CROSS_PROJECT_ALIAS_SUMMARY"
          else
            if [ -n "${{ inputs.env_vars }}" ]; then
              gcloud_cmd+=("--set-env-vars=${{ inputs.env_vars }}")
            fi
            if [ "${#SAME_PROJECT_SECRET_LINES[@]}" -gt 0 ]; then
              { IFS=,; SECRET_LIST="${SAME_PROJECT_SECRET_LINES[*]}"; }
              gcloud_cmd+=("--set-secrets=${SECRET_LIST}")
              DEPLOYMENT_MODE="same-project-secrets"
            fi
          fi

          echo "DEPLOYMENT_MODE=$DEPLOYMENT_MODE" >> "$GITHUB_ENV"

          echo "deployment_mode=$DEPLOYMENT_MODE" >> "$GITHUB_OUTPUT"
          {
            echo "cross_project_alias_summary<<EOF"
            echo "$CROSS_PROJECT_ALIAS_SUMMARY"
            echo "EOF"
            echo "cross_project_alias_count=$CROSS_PROJECT_ALIAS_COUNT"
            echo "cross_project_secret_summary<<EOF"
            echo "$CROSS_PROJECT_ALIAS_SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # Deploy base revision
          "${gcloud_cmd[@]}"

          # Patch cross-project secrets via service YAML replace (alias mapping)
          if [ "${#CROSS_PROJECT_SECRET_LINES[@]}" -gt 0 ]; then
            echo "::notice::Base rollout succeeded, exporting fresh service YAML for cross-project alias reconcile"

            if ! gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format=export > /tmp/service.yaml; then
              echo "::error::Failed to export service YAML for $SERVICE"
              exit 1
            fi

            if [ ! -s /tmp/service.yaml ]; then
              echo "::error::Exported service YAML is empty"
              exit 1
            fi

            write_xproj_patcher

            for line in "${CROSS_PROJECT_SECRET_LINES[@]}"; do
              ENV_NAME="${line%%=*}"
              REST="${line#*=}"
              SECRET_RESOURCE="${REST%%:*}"
              SECRET_VERSION="${REST#*:}"
              if [ -z "$SECRET_VERSION" ] || [ "$SECRET_VERSION" = "$REST" ]; then
                SECRET_VERSION="latest"
              fi

              if ! python3 /tmp/inject_xproj_secret.py "$ENV_NAME" "$SECRET_RESOURCE" "$SECRET_VERSION"; then
                echo "::error::Failed to inject cross-project secret $ENV_NAME"
                exit 1
              fi
            done

            if ! gcloud run services replace /tmp/service.yaml --region="$REGION" --project="$PROJECT_ID"; then
              echo "::error::Failed to apply patched service YAML for $SERVICE"
              exit 1
            fi

            if ! gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format=json > /tmp/service.json; then
              echo "::error::Failed to export service JSON for cross-project verification"
              exit 1
            fi

            if ! verify_xproj_service /tmp/service.json "${CROSS_PROJECT_SECRET_LINES[@]}"; then
              echo "::error::Cross-project secret verification failed for $SERVICE"
              exit 1
            fi

            echo "::notice::Cross-project alias mapping verified on live service"
          fi

          URL=$(gcloud run services describe "$SERVICE" --region="$REGION" --project="$PROJECT_ID" --format="value(status.url)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      
      - name: Update deployment summary
        if: always()
        run: |
          echo "## 🚀 Reusable Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Service**: $SERVICE" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL**: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Mode**: ${DEPLOYMENT_MODE:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Cross-project alias count**: ${{ steps.deploy.outputs.cross_project_alias_count || '0' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  publish_release_sbom:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' && startsWith(github.ref, 'refs/tags/') && github.repository_visibility != 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # required to create/update GitHub releases on tag refs
      actions: read # required to download the SBOM artifact from the deploy job

    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-${{ github.sha }}

      - name: Upload SBOM to release
        # Avoid publishing SBOMs to public repos by default; remove the guard if transparency to public is desired.
        # Using gh CLI instead of softprops/action-gh-release (not allowed in enterprise)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          # Create release if it doesn't exist, then upload SBOM
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" 2>/dev/null || \
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --title "$TAG_NAME" --generate-notes
          gh release upload "$TAG_NAME" sbom.json --repo "$GITHUB_REPOSITORY" --clobber
