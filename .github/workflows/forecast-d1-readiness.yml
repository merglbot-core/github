name: Forecast D-1 Readiness Guardrail (per-tenant slots, Europe/Prague)

on:
  workflow_dispatch:
    inputs:
      patch_date_local:
        description: "Date to check (YYYY-MM-DD, Europe/Prague). Default: yesterday."
        required: false
        type: string
      dry_run:
        description: "Skip the GitHub issue upsert (dry run; summary and artifacts are still produced)"
        required: false
        type: boolean
        default: true
      send_success_rate:
        description: "Also send daily 30d success-rate message (10:00-style)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # For WIF/OIDC
  issues: write    # Readiness issue upsert (replaces the retired chat alert, infra#3841)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    name: Forecast D-1 readiness
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'schedule' && (startsWith(github.event.schedule, '20 ') || startsWith(github.event.schedule, '15 ') || startsWith(github.event.schedule, '5 ') || startsWith(github.event.schedule, '0 ')))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Authenticate to GCP via WIF (and install gcloud/bq/gsutil)
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Run forecast D-1 readiness
        id: guardrail
        # NOTE: We intentionally do NOT run the "core" (non-isolated) scope on `5 *` schedules.
        # Minute 5 is reserved for the isolated `autodoplnky` slot (see dedicated steps below).
        if: >-
          ${{
            (
              github.event_name == 'workflow_dispatch' ||
              (github.event_name == 'schedule' && (startsWith(github.event.schedule, '20 ') || startsWith(github.event.schedule, '15 ') || startsWith(github.event.schedule, '0 ')))
            )
          }}
        continue-on-error: true
        env:
          PATCH_DATE_LOCAL: ${{ inputs.patch_date_local }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          OUTDIR="forecast-d1-readiness-out"

          CMD=(
            python scripts/guardrails/forecast_d1_readiness.py
            --outdir "$OUTDIR"
            --timezone "Europe/Prague"
            --mode "$MODE"
          )
          if [[ -n "${PATCH_DATE_LOCAL:-}" ]]; then
            CMD+=( --patch-date-local "$PATCH_DATE_LOCAL" )
          fi

          # The Ruzovyslon runtime was decommissioned and its readiness lane
          # cannot produce a meaningful result. Keep it out of both scheduled
          # and manual broad scopes until an independently verified runtime is
          # introduced.
          EXTRA_ARGS=( --exclude-tenant "ruzovyslon" )
          if [[ "${MODE}" == "auto" ]]; then
            case "${GITHUB_EVENT_SCHEDULE:-}" in
              15\ *)
                EXTRA_ARGS+=( --include-tenant "denatura" --auto-utc-minute "15" --auto-local-hour "8" --auto-local-hour "10" )
                ;;
              20\ *)
                EXTRA_ARGS+=( --exclude-tenant "denatura" --exclude-tenant "cerano" --exclude-tenant "livero" --exclude-tenant "proteinaco" --exclude-tenant "autodoplnky" --allow-empty-specs )
                ;;
              0\ *)
                EXTRA_ARGS+=( --include-tenant "cerano" --include-tenant "livero" --auto-utc-minute "0" --auto-local-hour "9" --auto-local-hour "11" )
                ;;
            esac
          fi
          if [[ "${#EXTRA_ARGS[@]}" -gt 0 ]]; then
            CMD+=( "${EXTRA_ARGS[@]}" )
          fi

          SCOPE_LABEL="all"
          if [[ "${MODE}" == "auto" ]]; then
            case "${GITHUB_EVENT_SCHEDULE:-}" in
              15\ *) SCOPE_LABEL="denatura" ;;
              0\ *) SCOPE_LABEL="cerano+livero" ;;
              20\ *) SCOPE_LABEL="core" ;;
            esac
          fi

          printf 'Running:'
          printf ' %q' "${CMD[@]}"
          printf '\n'
          EXIT=0
          "${CMD[@]}" || EXIT=$?

          echo "outdir=${OUTDIR}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${EXIT}" >> "$GITHUB_OUTPUT"
          echo "scope_label=${SCOPE_LABEL}" >> "$GITHUB_OUTPUT"

          SUMMARY_JSON="${OUTDIR}/forecast_d1_readiness_summary.json"
          if [ -f "$SUMMARY_JSON" ]; then
            SUMMARY_JSON="$SUMMARY_JSON" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          p = Path(os.environ["SUMMARY_JSON"])
          s = json.loads(p.read_text(encoding="utf-8"))

          def _v(key: str, default: str = "") -> str:
              v = s.get(key, default)
              return "" if v is None else str(v)

          print(f"status={_v('status')}")
          print(f"slot={_v('slot')}")
          print(f"patch_date_local={_v('patch_date_local')}")
          print(f"required_policy={_v('required_policy')}")
          print(f"required_failed={_v('required_failed', '0')}")
          print(f"optional_failed={_v('optional_failed', '0')}")
          print(f"required_total={_v('required_total', '0')}")
          print(f"optional_total={_v('optional_total', '0')}")
          PY
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "patch_date_local=" >> "$GITHUB_OUTPUT"
            echo "required_policy=" >> "$GITHUB_OUTPUT"
            echo "required_failed=0" >> "$GITHUB_OUTPUT"
            echo "optional_failed=0" >> "$GITHUB_OUTPUT"
            echo "required_total=0" >> "$GITHUB_OUTPUT"
            echo "optional_total=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Run forecast D-2 readiness (info only)
        id: guardrail_d2
        # NOTE: Same as D-1: core D-2 is intentionally skipped on `5 *` (autodoplnky-only schedules).
        if: >-
          ${{
            (
              github.event_name == 'workflow_dispatch' ||
              (github.event_name == 'schedule' && (startsWith(github.event.schedule, '20 ') || startsWith(github.event.schedule, '15 ') || startsWith(github.event.schedule, '0 ')))
            )
          }}
        continue-on-error: true
        env:
          PATCH_DATE_LOCAL_D1: ${{ steps.guardrail.outputs.patch_date_local }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          OUTDIR="forecast-d1-readiness-out-d2"
          mkdir -p "$OUTDIR"
          echo "outdir=${OUTDIR}" >> "$GITHUB_OUTPUT"

          PATCH_DATE_LOCAL_D1="${PATCH_DATE_LOCAL_D1:-}"
          if [ -z "${PATCH_DATE_LOCAL_D1}" ]; then
            echo "ℹ️ Missing D-1 patch_date_local; skipping D-2 run."
            echo "outdir=${OUTDIR}" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            echo "status=NOOP" >> "$GITHUB_OUTPUT"
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "patch_date_local=" >> "$GITHUB_OUTPUT"
            echo "required_policy=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PATCH_DATE_LOCAL_D2="$(
            PATCH_DATE_LOCAL_D1="$PATCH_DATE_LOCAL_D1" python - <<'PY'
          from datetime import date, timedelta
          import os

          d = date.fromisoformat(os.environ["PATCH_DATE_LOCAL_D1"])
          print((d - timedelta(days=1)).isoformat())
          PY
          )"

          CMD=(
            python scripts/guardrails/forecast_d1_readiness.py
            --outdir "$OUTDIR"
            --timezone "Europe/Prague"
            --mode "$MODE"
            --patch-date-local "$PATCH_DATE_LOCAL_D2"
          )

          EXTRA_ARGS=( --exclude-tenant "ruzovyslon" )
          if [[ "${MODE}" == "auto" ]]; then
            case "${GITHUB_EVENT_SCHEDULE:-}" in
              15\ *)
                EXTRA_ARGS+=( --include-tenant "denatura" --auto-utc-minute "15" --auto-local-hour "8" --auto-local-hour "10" )
                ;;
              20\ *)
                EXTRA_ARGS+=( --exclude-tenant "denatura" --exclude-tenant "cerano" --exclude-tenant "livero" --exclude-tenant "proteinaco" --exclude-tenant "autodoplnky" --allow-empty-specs )
                ;;
              0\ *)
                EXTRA_ARGS+=( --include-tenant "cerano" --include-tenant "livero" --auto-utc-minute "0" --auto-local-hour "9" --auto-local-hour "11" )
                ;;
            esac
          fi
          if [[ "${#EXTRA_ARGS[@]}" -gt 0 ]]; then
            CMD+=( "${EXTRA_ARGS[@]}" )
          fi

          printf 'Running:'
          printf ' %q' "${CMD[@]}"
          printf '\n'
          EXIT=0
          "${CMD[@]}" || EXIT=$?

          echo "outdir=${OUTDIR}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${EXIT}" >> "$GITHUB_OUTPUT"

          SUMMARY_JSON="${OUTDIR}/forecast_d1_readiness_summary.json"
          if [ -f "$SUMMARY_JSON" ]; then
            SUMMARY_JSON="$SUMMARY_JSON" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          p = Path(os.environ["SUMMARY_JSON"])
          s = json.loads(p.read_text(encoding="utf-8"))

          def _v(key: str, default: str = "") -> str:
              v = s.get(key, default)
              return "" if v is None else str(v)

          print(f"status={_v('status')}")
          print(f"slot={_v('slot')}")
          print(f"patch_date_local={_v('patch_date_local')}")
          print(f"required_policy={_v('required_policy')}")
          PY
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "patch_date_local=${PATCH_DATE_LOCAL_D2}" >> "$GITHUB_OUTPUT"
            echo "required_policy=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run forecast D-1 readiness (Proteinaco)
        id: guardrail_proteinaco
        if: github.event_name == 'schedule' && startsWith(github.event.schedule, '20 ')
        continue-on-error: true
        env:
          PATCH_DATE_LOCAL: ${{ inputs.patch_date_local }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          OUTDIR="forecast-d1-readiness-out-proteinaco"

          CMD=(
            python scripts/guardrails/forecast_d1_readiness.py
            --outdir "$OUTDIR"
            --timezone "Europe/Prague"
            --mode "$MODE"
            --include-tenant "proteinaco"
            --auto-utc-minute "20"
            --auto-local-hour "9"
            --auto-local-hour "11"
          )
          if [[ -n "${PATCH_DATE_LOCAL:-}" ]]; then
            CMD+=( --patch-date-local "$PATCH_DATE_LOCAL" )
          fi

          printf 'Running (proteinaco):'
          printf ' %q' "${CMD[@]}"
          printf '\n'
          EXIT=0
          "${CMD[@]}" || EXIT=$?

          echo "outdir=${OUTDIR}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${EXIT}" >> "$GITHUB_OUTPUT"
          echo "scope_label=proteinaco" >> "$GITHUB_OUTPUT"

          SUMMARY_JSON="${OUTDIR}/forecast_d1_readiness_summary.json"
          if [ -f "$SUMMARY_JSON" ]; then
            SUMMARY_JSON="$SUMMARY_JSON" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          p = Path(os.environ["SUMMARY_JSON"])
          s = json.loads(p.read_text(encoding="utf-8"))

          def _v(key: str, default: str = "") -> str:
              v = s.get(key, default)
              return "" if v is None else str(v)

          print(f"status={_v('status')}")
          print(f"slot={_v('slot')}")
          print(f"patch_date_local={_v('patch_date_local')}")
          print(f"required_policy={_v('required_policy')}")
          PY
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "patch_date_local=" >> "$GITHUB_OUTPUT"
            echo "required_policy=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run forecast D-2 readiness (Proteinaco, info only)
        id: guardrail_d2_proteinaco
        if: github.event_name == 'schedule' && startsWith(github.event.schedule, '20 ')
        continue-on-error: true
        env:
          PATCH_DATE_LOCAL_D1: ${{ steps.guardrail_proteinaco.outputs.patch_date_local }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          OUTDIR="forecast-d1-readiness-out-d2-proteinaco"
          mkdir -p "$OUTDIR"
          echo "outdir=${OUTDIR}" >> "$GITHUB_OUTPUT"

          PATCH_DATE_LOCAL_D1="${PATCH_DATE_LOCAL_D1:-}"
          if [ -z "${PATCH_DATE_LOCAL_D1}" ]; then
            echo "ℹ️ Missing Proteinaco D-1 patch_date_local; skipping D-2 run."
            echo "outdir=${OUTDIR}" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            echo "status=NOOP" >> "$GITHUB_OUTPUT"
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "patch_date_local=" >> "$GITHUB_OUTPUT"
            echo "required_policy=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PATCH_DATE_LOCAL_D2="$(
            PATCH_DATE_LOCAL_D1="$PATCH_DATE_LOCAL_D1" python - <<'PY'
          from datetime import date, timedelta
          import os

          d = date.fromisoformat(os.environ["PATCH_DATE_LOCAL_D1"])
          print((d - timedelta(days=1)).isoformat())
          PY
          )"

          CMD=(
            python scripts/guardrails/forecast_d1_readiness.py
            --outdir "$OUTDIR"
            --timezone "Europe/Prague"
            --mode "$MODE"
            --patch-date-local "$PATCH_DATE_LOCAL_D2"
            --include-tenant "proteinaco"
            --auto-utc-minute "20"
            --auto-local-hour "9"
            --auto-local-hour "11"
          )

          printf 'Running (proteinaco D-2):'
          printf ' %q' "${CMD[@]}"
          printf '\n'
          EXIT=0
          "${CMD[@]}" || EXIT=$?

          echo "outdir=${OUTDIR}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${EXIT}" >> "$GITHUB_OUTPUT"

          SUMMARY_JSON="${OUTDIR}/forecast_d1_readiness_summary.json"
          if [ -f "$SUMMARY_JSON" ]; then
            SUMMARY_JSON="$SUMMARY_JSON" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          p = Path(os.environ["SUMMARY_JSON"])
          s = json.loads(p.read_text(encoding="utf-8"))

          def _v(key: str, default: str = "") -> str:
              v = s.get(key, default)
              return "" if v is None else str(v)

          print(f"status={_v('status')}")
          print(f"slot={_v('slot')}")
          print(f"patch_date_local={_v('patch_date_local')}")
          print(f"required_policy={_v('required_policy')}")
          PY
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "patch_date_local=" >> "$GITHUB_OUTPUT"
            echo "required_policy=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run forecast D-1 readiness (Autodoplnky)
        id: guardrail_autodoplnky
        if: github.event_name == 'schedule' && startsWith(github.event.schedule, '5 ')
        continue-on-error: true
        env:
          PATCH_DATE_LOCAL: ${{ inputs.patch_date_local }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          OUTDIR="forecast-d1-readiness-out-autodoplnky"

          CMD=(
            python scripts/guardrails/forecast_d1_readiness.py
            --outdir "$OUTDIR"
            --timezone "Europe/Prague"
            --mode "$MODE"
            --include-tenant "autodoplnky"
            --auto-utc-minute "5"
            --auto-local-hour "9"
            --auto-local-hour "12"
          )
          if [[ -n "${PATCH_DATE_LOCAL:-}" ]]; then
            CMD+=( --patch-date-local "$PATCH_DATE_LOCAL" )
          fi

          printf 'Running (autodoplnky):'
          printf ' %q' "${CMD[@]}"
          printf '\n'
          EXIT=0
          "${CMD[@]}" || EXIT=$?

          echo "outdir=${OUTDIR}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${EXIT}" >> "$GITHUB_OUTPUT"
          echo "scope_label=autodoplnky" >> "$GITHUB_OUTPUT"

          SUMMARY_JSON="${OUTDIR}/forecast_d1_readiness_summary.json"
          if [ -f "$SUMMARY_JSON" ]; then
            SUMMARY_JSON="$SUMMARY_JSON" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          p = Path(os.environ["SUMMARY_JSON"])
          s = json.loads(p.read_text(encoding="utf-8"))

          def _v(key: str, default: str = "") -> str:
              v = s.get(key, default)
              return "" if v is None else str(v)

          print(f"status={_v('status')}")
          print(f"slot={_v('slot')}")
          print(f"patch_date_local={_v('patch_date_local')}")
          print(f"required_policy={_v('required_policy')}")
          PY
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "patch_date_local=" >> "$GITHUB_OUTPUT"
            echo "required_policy=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run forecast D-2 readiness (Autodoplnky, info only)
        id: guardrail_d2_autodoplnky
        if: github.event_name == 'schedule' && startsWith(github.event.schedule, '5 ')
        continue-on-error: true
        env:
          PATCH_DATE_LOCAL_D1: ${{ steps.guardrail_autodoplnky.outputs.patch_date_local }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          OUTDIR="forecast-d1-readiness-out-d2-autodoplnky"
          mkdir -p "$OUTDIR"
          echo "outdir=${OUTDIR}" >> "$GITHUB_OUTPUT"

          PATCH_DATE_LOCAL_D1="${PATCH_DATE_LOCAL_D1:-}"
          if [ -z "${PATCH_DATE_LOCAL_D1}" ]; then
            echo "ℹ️ Missing Autodoplnky D-1 patch_date_local; skipping D-2 run."
            echo "outdir=${OUTDIR}" >> "$GITHUB_OUTPUT"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            echo "status=NOOP" >> "$GITHUB_OUTPUT"
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "patch_date_local=" >> "$GITHUB_OUTPUT"
            echo "required_policy=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PATCH_DATE_LOCAL_D2="$(
            PATCH_DATE_LOCAL_D1="$PATCH_DATE_LOCAL_D1" python - <<'PY'
          from datetime import date, timedelta
          import os

          d = date.fromisoformat(os.environ["PATCH_DATE_LOCAL_D1"])
          print((d - timedelta(days=1)).isoformat())
          PY
          )"

          CMD=(
            python scripts/guardrails/forecast_d1_readiness.py
            --outdir "$OUTDIR"
            --timezone "Europe/Prague"
            --mode "$MODE"
            --patch-date-local "$PATCH_DATE_LOCAL_D2"
            --include-tenant "autodoplnky"
            --auto-utc-minute "5"
            --auto-local-hour "9"
            --auto-local-hour "12"
          )

          printf 'Running (autodoplnky D-2):'
          printf ' %q' "${CMD[@]}"
          printf '\n'
          EXIT=0
          "${CMD[@]}" || EXIT=$?

          echo "outdir=${OUTDIR}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${EXIT}" >> "$GITHUB_OUTPUT"

          SUMMARY_JSON="${OUTDIR}/forecast_d1_readiness_summary.json"
          if [ -f "$SUMMARY_JSON" ]; then
            SUMMARY_JSON="$SUMMARY_JSON" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          p = Path(os.environ["SUMMARY_JSON"])
          s = json.loads(p.read_text(encoding="utf-8"))

          def _v(key: str, default: str = "") -> str:
              v = s.get(key, default)
              return "" if v is None else str(v)

          print(f"status={_v('status')}")
          print(f"slot={_v('slot')}")
          print(f"patch_date_local={_v('patch_date_local')}")
          print(f"required_policy={_v('required_policy')}")
          PY
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "slot=" >> "$GITHUB_OUTPUT"
            echo "patch_date_local=" >> "$GITHUB_OUTPUT"
            echo "required_policy=" >> "$GITHUB_OUTPUT"
          fi

      - name: Add report to step summary
        if: always() && steps.guardrail.outputs.outdir != '' && steps.guardrail.outputs.status != 'NOOP'
        run: |
          MD_FILE="${{ steps.guardrail.outputs.outdir }}/forecast_d1_readiness_report.md"
          echo "## ✅ Forecast D-1 readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$MD_FILE" ]; then
            head -n 200 "$MD_FILE" >> "$GITHUB_STEP_SUMMARY"
            if [ "$(wc -l < "$MD_FILE")" -gt 200 ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "*... Report truncated. See artifacts for full report.*" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "❌ No report generated." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exit code: ${{ steps.guardrail.outputs.exit_code }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ steps.guardrail.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Slot: ${{ steps.guardrail.outputs.slot }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Required policy: ${{ steps.guardrail.outputs.required_policy }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Patch date (local): ${{ steps.guardrail.outputs.patch_date_local }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Required failed: ${{ steps.guardrail.outputs.required_failed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Optional failed: ${{ steps.guardrail.outputs.optional_failed }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload guardrail artifacts
        if: always() && steps.guardrail.outputs.outdir != '' && steps.guardrail.outputs.status != 'NOOP'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: forecast-d1-readiness-${{ github.run_id }}
          path: |
            ${{ steps.guardrail.outputs.outdir }}/
            ${{ steps.guardrail_d2.outputs.outdir }}/
          retention-days: 90

      - name: Upload Proteinaco guardrail artifacts
        if: always() && steps.guardrail_proteinaco.outputs.outdir != '' && steps.guardrail_proteinaco.outputs.status != 'NOOP'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: forecast-d1-readiness-proteinaco-${{ github.run_id }}
          path: |
            ${{ steps.guardrail_proteinaco.outputs.outdir }}/
            ${{ steps.guardrail_d2_proteinaco.outputs.outdir }}/
          retention-days: 90

      - name: Upload Autodoplnky guardrail artifacts
        if: always() && steps.guardrail_autodoplnky.outputs.outdir != '' && steps.guardrail_autodoplnky.outputs.status != 'NOOP'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: forecast-d1-readiness-autodoplnky-${{ github.run_id }}
          path: |
            ${{ steps.guardrail_autodoplnky.outputs.outdir }}/
            ${{ steps.guardrail_d2_autodoplnky.outputs.outdir }}/
          retention-days: 90

      # Slack alerts were removed (owner decision 16 Oct 2026, merglbot-core/infra#3841):
      # the verdict now lives in the step summary, the uploaded artifacts and one
      # GitHub issue per scope (opened/updated on a NOT-READY verdict, closed on READY).
      - name: Upsert readiness issue (NOT-READY opens, READY closes)
        if: >-
          ${{
            always() &&
            inputs.dry_run != true &&
            (
              (steps.guardrail.outputs.exit_code != '' && steps.guardrail.outputs.status != 'NOOP') ||
              (steps.guardrail_proteinaco.outputs.exit_code != '' && steps.guardrail_proteinaco.outputs.status != 'NOOP') ||
              (steps.guardrail_autodoplnky.outputs.exit_code != '' && steps.guardrail_autodoplnky.outputs.status != 'NOOP')
            )
          }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIN_STATUS: ${{ steps.guardrail.outputs.status }}
          MAIN_OUTDIR: ${{ steps.guardrail.outputs.outdir }}
          MAIN_SCOPE_LABEL: ${{ steps.guardrail.outputs.scope_label }}
          PROTEINACO_STATUS: ${{ steps.guardrail_proteinaco.outputs.status }}
          PROTEINACO_OUTDIR: ${{ steps.guardrail_proteinaco.outputs.outdir }}
          PROTEINACO_SCOPE_LABEL: ${{ steps.guardrail_proteinaco.outputs.scope_label }}
          AUTODOPLNKY_STATUS: ${{ steps.guardrail_autodoplnky.outputs.status }}
          AUTODOPLNKY_OUTDIR: ${{ steps.guardrail_autodoplnky.outputs.outdir }}
          AUTODOPLNKY_SCOPE_LABEL: ${{ steps.guardrail_autodoplnky.outputs.scope_label }}
        run: |
          set -euo pipefail

          LABEL="final-data-readiness"
          gh label create "$LABEL" --force \
            --color "D93F0B" \
            --description "Forecast D-1 readiness verdict (one open issue per scope while NOT-READY)"

          # Fail closed: a failed listing is an error, never an empty backlog.
          find_open_issue() {
            local title="$1"
            local out
            if ! out="$(gh issue list --label "$LABEL" --state open --limit 100 --json number,title \
                        | jq -r --arg t "$title" '[.[] | select(.title == $t) | .number] | first // ""')"; then
              echo "::error::gh issue list failed for '${title}'"
              exit 1
            fi
            printf '%s' "$out"
          }

          build_body() {
            local status="$1" scope="$2" outdir="$3" body="$4"
            local summary_json="${outdir}/forecast_d1_readiness_summary.json"
            local report_md="${outdir}/forecast_d1_readiness_report.md"
            {
              echo "## Forecast D-1 readiness: ${scope}"
              echo ""
              echo "- Verdict: **${status}**"
              echo "- Scope: \`${scope}\`"
              echo "- Run: ${RUN_URL}"
              if [ -f "$summary_json" ]; then
                SUMMARY_JSON="$summary_json" python - <<'PY'
          import json
          import os

          s = json.loads(open(os.environ["SUMMARY_JSON"], encoding="utf-8").read())
          for key in ("slot", "patch_date_local", "required_policy", "required_failed", "required_total", "optional_failed", "optional_total"):
              print(f"- {key}: `{s.get(key, '')}`")
          PY
              fi
              echo ""
              if [ -f "$report_md" ]; then
                echo "<details><summary>Report (first 120 lines)</summary>"
                echo ""
                head -n 120 "$report_md"
                echo ""
                echo "</details>"
              else
                echo "_No report file produced._"
              fi
              echo ""
              echo "_Automated by forecast-d1-readiness.yml (issue upsert replaces the retired chat alert, merglbot-core/infra#3841)._"
            } > "$body"
          }

          upsert_scope() {
            local status="$1" outdir="$2" scope="$3"
            local title="[final-data] D1 readiness: ${scope}"
            local existing body
            existing="$(find_open_issue "$title")"
            body="$(mktemp)"
            build_body "$status" "$scope" "$outdir" "$body"

            if [ "$status" = "PASS" ]; then
              if [ -n "$existing" ]; then
                gh issue close "$existing" --comment "READY again on ${RUN_URL}; closing." --reason completed
                echo "Closed #${existing} (${title}) — verdict PASS"
              else
                echo "PASS for '${title}' — nothing to close"
              fi
            else
              if [ -n "$existing" ]; then
                gh issue comment "$existing" --body-file "$body"
                echo "Updated #${existing} (${title}) — verdict ${status}"
              else
                gh issue create --title "$title" --label "$LABEL" --body-file "$body"
                echo "Opened issue (${title}) — verdict ${status}"
              fi
            fi
            rm -f "$body"
          }

          if [[ -n "${MAIN_STATUS:-}" && "${MAIN_STATUS}" != "NOOP" && -n "${MAIN_OUTDIR:-}" ]]; then
            upsert_scope "$MAIN_STATUS" "$MAIN_OUTDIR" "${MAIN_SCOPE_LABEL:-main}"
          fi
          if [[ -n "${PROTEINACO_STATUS:-}" && "${PROTEINACO_STATUS}" != "NOOP" && -n "${PROTEINACO_OUTDIR:-}" ]]; then
            upsert_scope "$PROTEINACO_STATUS" "$PROTEINACO_OUTDIR" "${PROTEINACO_SCOPE_LABEL:-proteinaco}"
          fi
          if [[ -n "${AUTODOPLNKY_STATUS:-}" && "${AUTODOPLNKY_STATUS}" != "NOOP" && -n "${AUTODOPLNKY_OUTDIR:-}" ]]; then
            upsert_scope "$AUTODOPLNKY_STATUS" "$AUTODOPLNKY_OUTDIR" "${AUTODOPLNKY_SCOPE_LABEL:-autodoplnky}"
          fi

      - name: Fail workflow if guardrail failed
        if: >-
          ${{
            (
              (steps.guardrail.outputs.exit_code != '' && steps.guardrail.outputs.exit_code != '0') ||
              (steps.guardrail_proteinaco.outputs.exit_code != '' && steps.guardrail_proteinaco.outputs.exit_code != '0') ||
              (steps.guardrail_autodoplnky.outputs.exit_code != '' && steps.guardrail_autodoplnky.outputs.exit_code != '0')
            )
          }}
        run: exit 1

  stats_30d:
    name: Forecast D-1 success rate (30d)
    if: >-
      ${{
        (github.event_name == 'schedule' && (github.event.schedule == '0 8 * * *' || github.event.schedule == '0 9 * * *')) ||
        (github.event_name == 'workflow_dispatch' && inputs.send_success_rate == true)
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Authenticate to GCP via WIF (and install gcloud/bq/gsutil)
        uses: ./.github/actions/setup-gcp-auth
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Run success rate (30d)
        id: stats
        continue-on-error: true
        env:
          PATCH_DATE_LOCAL: ${{ inputs.patch_date_local }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          OUTDIR="forecast-d1-readiness-stats-out"
          echo "outdir=${OUTDIR}" >> "$GITHUB_OUTPUT"

          CMD=(
            python scripts/guardrails/forecast_d1_readiness.py
            --outdir "$OUTDIR"
            --timezone "Europe/Prague"
            --mode "$MODE"
            --kind "success_rate_30d"
          )
          if [[ -n "${PATCH_DATE_LOCAL:-}" ]]; then
            CMD+=( --patch-date-local "$PATCH_DATE_LOCAL" )
          fi

          printf 'Running:'
          printf ' %q' "${CMD[@]}"
          printf '\n'
          EXIT=0
          "${CMD[@]}" || EXIT=$?

          echo "outdir=${OUTDIR}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${EXIT}" >> "$GITHUB_OUTPUT"

          SUMMARY_JSON="${OUTDIR}/forecast_d1_readiness_summary.json"
          if [ -f "$SUMMARY_JSON" ]; then
            SUMMARY_JSON="$SUMMARY_JSON" python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          p = Path(os.environ["SUMMARY_JSON"])
          s = json.loads(p.read_text(encoding="utf-8"))

          def _v(key: str, default: str = "") -> str:
              v = s.get(key, default)
              return "" if v is None else str(v)

          print(f"status={_v('status')}")
          print(f"patch_date_local={_v('patch_date_local')}")
          print(f"window_start={_v('window_start')}")
          print(f"window_end={_v('window_end')}")
          print(f"window_start_d2={_v('window_start_d2')}")
          print(f"window_end_d2={_v('window_end_d2')}")
          print(f"days={_v('days', '30')}")
          print(f"errors_total={_v('errors_total', '0')}")
          PY
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "patch_date_local=" >> "$GITHUB_OUTPUT"
            echo "window_start=" >> "$GITHUB_OUTPUT"
            echo "window_end=" >> "$GITHUB_OUTPUT"
            echo "window_start_d2=" >> "$GITHUB_OUTPUT"
            echo "window_end_d2=" >> "$GITHUB_OUTPUT"
            echo "days=30" >> "$GITHUB_OUTPUT"
            echo "errors_total=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload stats artifacts
        if: always() && steps.stats.outputs.outdir != ''
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: forecast-d1-readiness-stats-${{ github.run_id }}
          path: ${{ steps.stats.outputs.outdir }}/
          retention-days: 90

      # Slack alerts were removed (owner decision 16 Oct 2026, merglbot-core/infra#3841):
      # the 30d success-rate verdict lives in the step summary and the uploaded artifacts.
      - name: Add 30d success rate to step summary
        if: always() && steps.stats.outputs.outdir != '' && steps.stats.outputs.status != 'NOOP'
        env:
          OUTDIR: ${{ steps.stats.outputs.outdir }}
        run: |
          {
            echo "## 📈 Forecast D-1 success rate (30d)"
            echo ""
            echo "- Status: ${{ steps.stats.outputs.status }}"
            echo "- Exit code: ${{ steps.stats.outputs.exit_code }}"
            echo "- Window D-1: ${{ steps.stats.outputs.window_start }} → ${{ steps.stats.outputs.window_end }}"
            echo "- Window D-2: ${{ steps.stats.outputs.window_start_d2 }} → ${{ steps.stats.outputs.window_end_d2 }}"
            echo "- Errors total: ${{ steps.stats.outputs.errors_total }}"
            echo ""
            REPORT_CSV="${OUTDIR}/forecast_d1_readiness_success_rate_report.csv"
            if [ -f "$REPORT_CSV" ]; then
              echo '```'
              head -n 60 "$REPORT_CSV"
              echo '```'
            else
              echo "❌ No success-rate report generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow if stats failed
        if: steps.stats.outputs.exit_code != '0'
        run: exit 1
